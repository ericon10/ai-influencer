# Review reasons and the fix each one triggers (SPEC 11). A reason maps to an
# action; an action may add a line to the regenerated prompt. Actions for
# later phases fall back to a plain regenerate until that phase ships.
version: 1
reasons:
  - { id: face_drift,      label: "Face drifted",            action: regenerate_closer_refs, spec: "5.3.25" }
  - { id: mark_wrong_side, label: "Mark on wrong side",      action: regenerate_marks,       spec: "5.1.11" }
  - { id: mark_missing,    label: "Mark missing",            action: regenerate_marks,       spec: "5.1.12" }
  - { id: wrong_view,      label: "Wrong angle or mirrored", action: regenerate_view }
  - { id: wrong_framing,   label: "Wrong framing",           action: regenerate_framing }
  - { id: extra_jewelry,   label: "Extra jewelry",           action: edit_one_detail,        spec: "5.3.23" }
  - { id: logo,            label: "Logo or text",            action: edit_one_detail,        spec: "5.2.17" }
  - { id: makeup,          label: "Wearing makeup",          action: regenerate_natural,     spec: "0" }
  - { id: skin_smoothed,   label: "Skin smoothed or plastic", action: regenerate_texture,    spec: "0" }
  - { id: hands,           label: "Hands",                   action: regenerate }
  - { id: talking,         label: "Talking",                 action: video_listen,           spec: "5.4.29" }
  - { id: other,           label: "Something else",          action: regenerate }
actions:
  regenerate:
    label: Regenerate
  regenerate_closer_refs:
    label: Regenerate with the closest-angle refs
    prompt_addendum: "Match the face in the reference images exactly: same person, not a lookalike."
  regenerate_marks:
    label: Regenerate with marks stressed
    prompt_addendum: "Check each distinguishing mark's side carefully. Do not mirror the image or move any mark to the other side."
  regenerate_view:
    label: Regenerate with the angle stressed
    prompt_addendum: "Keep the exact head angle described. Do not mirror or flip the image."
  regenerate_framing:
    label: Regenerate with the framing stressed
    prompt_addendum: "Keep exactly the framing described; do not zoom out or seat the person."
  regenerate_natural:
    label: Regenerate bare-faced
    prompt_addendum: "Bare face, exactly as in the reference."
  regenerate_texture:
    label: Regenerate with real skin texture
    prompt_addendum: "Keep the real skin texture of the reference: visible pores and the same small imperfections, unsmoothed."
  edit_one_detail:
    label: Fix with a one-change edit
    phase: 2
    fallback: regenerate
  video_listen:
    label: Regenerate as listening
    phase: 3
    fallback: regenerate
qa:
  # SFace cosine similarity: same person at or above this value.
  identity_min_similarity: 0.363
  # The character must not match the inspiration person (SPEC 6, distinctness).
  distinctness_max_similarity: 0.363
  # Re-ask on a mirrored copy and require mirrored answers; catches a model
  # confusing image left and right.
  mirror_consistency: true
  eye_color_check: true
