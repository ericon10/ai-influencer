# Model catalog. A model ref is "provider/model". A Higgsfield REST endpoint
# is filled in only from Higgsfield's official Model API Reference
# (docs.higgsfield.ai/docs/models, read 2026-10-13; `reference` names the
# page), never from third-party copies of the catalog. A model counts as
# confirmed only after one small paid test passes (Settings, Model tests);
# until then the adapter refuses to send live runs to it. `api: false` marks
# a model the API does not offer at all: it runs only through the account.
#
# Identity without training: Higgsfield Elements (reference characters) are
# instant and are used through a <<<element_id>>> placeholder in the prompt
# (verified live 2026-10-12). A character's element lives in its identity
# field, imported from the character file.
#
# Account path (the owner's Higgsfield account, plan credits): models with an
# mcp_id also run through the MCP connector. `mcp.params` lists the inputs
# the model accepts there (from models_explore, read 2026-10-13) and nothing
# else is sent; `mcp.fixed` is always sent (audio off for every video);
# `mcp.roles` names the media roles for references and start and end frames.
version: 1
models:
  # ── Higgsfield (primary, pay-per-use API) ──
  # Capabilities marked "verified live 2026-10-12" were confirmed by the
  # owner through the Higgsfield web app and MCP connector. Endpoints and
  # field names are from the official reference; each model still needs its
  # paid test (verified stays false until then).
  - ref: higgsfield/gpt-image-2.5
    label: GPT Image 2.5
    kinds: [image, image_edit]
    max_refs: 8
    reference: https://docs.higgsfield.ai/docs/models/marketing-studio-image/sunburst
    endpoint: marketing-studio/image/sunburst
    input_map: marketing_image
    verified: false
    mcp_id: gpt_image_2_5
    mcp: { params: [aspect_ratio, resolution, quality, variant], roles: { refs: image_references } }
    aliases: [GPT Image 2.5, gpt_image_2_5, GPT Image 2.5 Sunburst]
    params: { variants: [flare, sunburst] }
    use_for: [hero, sheet]
    notes: Sheet model (Callie's sheet was built here). Variants flare and sunburst, verified live 2026-10-12.
  - ref: higgsfield/gpt-image-2.5-flare
    label: GPT Image 2.5 Flare
    kinds: [image, image_edit]
    max_refs: 8
    reference: https://docs.higgsfield.ai/docs/models/marketing-studio-image/flare
    endpoint: marketing-studio/image/flare
    input_map: marketing_image
    verified: false
    mcp_id: gpt_image_2_5
    mcp: { params: [aspect_ratio, resolution, quality], fixed: { variant: flare }, roles: { refs: image_references } }
    aliases: [GPT Image 2.5 Flare, Flare]
    params: { variant: flare }
    # Flare adds lip gloss and a pout unless told otherwise (Callie's file,
    # Oct 13 test); every Flare prompt says it (owner, 2026-10-14).
    prompt_lines: ["Bare natural lips, no gloss."]
    # Flare does not take Elements (character template): its refs carry the
    # face, on the plan as on the API.
    elements: false
    use_for: [scene_still]
    notes: Strong for stills; made Callie's best beach shot with real skin texture and the right ear cuff, though it once distorted her hair in a scene. Run it alongside Nano Banana 2.1 and pick the best.
  - ref: higgsfield/nano-banana-2.1
    label: Nano Banana 2.1
    kinds: [image, image_edit]
    max_refs: 4
    api: false
    endpoint: null
    input_map: generic_image
    verified: false
    mcp_id: nano_banana_2_1
    # Masked edits: media role "mask" plus is_inpaint (Higgsfield catalog, read 2026-10-13).
    mcp: { params: [aspect_ratio, resolution, seed, thinking_level], roles: { refs: image_references, mask: mask }, inpaint_param: is_inpaint }
    aliases: [Nano Banana 2.1, nano_banana_2_1]
    params: { resolution: [1k, 2k, 4k], thinking_level: true, inpaint: mask }
    use_for: [scene_still, expression_edit]
    notes: Best for scene stills and expression edits; held face and hair well with refs (verified live 2026-10-12). Re-composes the frame, so never use it to upscale.
  # ── The API path without a Higgsfield plan (owner, 2026-10-22, item 19) ──
  # Nano Banana 2.1 through Google AI Studio (the Gemini API), the model the
  # proven recreates used: generateContent with responseModalities IMAGE and
  # imageConfig { aspectRatio, imageSize } (ai.google.dev, image
  # generation; the model id from Google's release, 2026-10-06). The key is
  # the account's own (Settings > Provider keys). Unconfirmed until its
  # first paid run, like every new model.
  - ref: google/nano-banana-2.1
    label: Nano Banana 2.1
    kinds: [image, image_edit]
    max_refs: 4
    reference: https://ai.google.dev/gemini-api/docs/image-generation
    endpoint: gemini-nano-banana-2.1
    input_map: gemini_image
    verified: false
    elements: false
    aliases: [Nano Banana 2.1 (Google AI Studio)]
    params: { resolution: [1k, 2k, 4k] }
    use_for: [scene_still]
    notes: Google AI Studio, pay per image. The same model as on your Higgsfield plan; REF-00 and one three-quarter view carry the face (no element).
  # Seedream 4.5 edit on fal, the stills' fallback when neither Nano Banana
  # path works (fal-ai/bytedance/seedream/v4.5/edit: prompt, image_urls up
  # to 10, image_size, seed; fal.ai docs).
  - ref: fal/seedream-4.5-edit
    label: Seedream 4.5 edit
    kinds: [image_edit]
    max_refs: 10
    reference: https://fal.ai/models/fal-ai/bytedance/seedream/v4.5/edit/api
    endpoint: fal-ai/bytedance/seedream/v4.5/edit
    input_map: fal_seedream_edit
    verified: false
    elements: false
    aliases: [Seedream 4.5 edit, Seedream 4.5]
    use_for: [scene_still]
    notes: fal, pay per image. The fallback for Recreate stills; not proven for a recreate yet.
  - ref: higgsfield/nano-banana-2
    label: Nano Banana 2
    kinds: [image, image_edit]
    max_refs: 4
    api: false
    endpoint: null
    input_map: generic_image
    verified: false
    mcp_id: nano_banana_2
    mcp: { params: [aspect_ratio, resolution], roles: { refs: image_references } }
    aliases: [Nano Banana 2, Nano Banana Pro]
    notes: Not on the pay-per-use API (absent from the official Model API Reference, 2026-10-13); runs through the Higgsfield account.

  - ref: higgsfield/soul-2
    label: Soul 2.0
    kinds: [image]
    max_refs: 0
    reference: https://docs.higgsfield.ai/docs/models/soul-2/generate
    endpoint: higgsfield-ai/soul/v2/standard
    input_map: soul_v2
    verified: false
    mcp_id: soul_2
    mcp: { params: [aspect_ratio, soul_id], fixed: { quality: 2k } }
    aliases: [Soul 2.0, Soul]
    # Soul draws whatever words it is given, even negated ones (owner,
    # 2026-10-21, 100 faceless stills): its prompts never name these.
    prompt_never: [text, texts, letter, letters, lettering, label, labels, labeled, labelled, logo, logos, watermark, watermarks, writing, written, words, caption, captions, typography, signage, sign, signs]
    notes: Soul 2.0 identity training failed or sat queued for hours (2026-10-12); never block on it. Use Elements instead.
  - ref: higgsfield/bytedance-upscale
    label: ByteDance image upscale (2k)
    kinds: [upscale]
    max_refs: 0
    api: false
    endpoint: null
    input_map: generic_upscale
    verified: false
    mcp_id: bytedance
    mcp: { params: [], fixed: { resolution: 2k } }
    aliases: [ByteDance upscale, bytedance image upscale]
    params: { resolution: [2k] }
    use_for: [upscale, punch_in_crop]
    notes: 2 credits at 2k (verified live 2026-10-12). Use for punch-in crops of a wide still.
  # The video upscaler on the owner's account (upscale_video). It keeps the
  # exact take; there is no cost preflight, so the price book answers.
  - ref: higgsfield/video-upscale
    label: Video upscale (ByteDance)
    kinds: [upscale]
    max_refs: 0
    api: false
    endpoint: null
    input_map: generic_upscale
    verified: false
    mcp_id: bytedance
    mcp: { params: [], fixed: { resolution: 1080p, preset: aigc, fps: 24 } }
    aliases: [Video upscale, upscale_video]
    params: { resolution: [1080p, 2k, 4k], fps: [24, 30, 60], preflight: none }
    use_for: [video_upscale]
    notes: "From the connector's description (2026-10-13): provider bytedance needs the source width and height; fps above 30 doubles the cost; no cost preflight."
  - ref: higgsfield/seedance-2.5
    label: Seedance 2.5
    kinds: [video]
    max_refs: 0
    reference: https://docs.higgsfield.ai/docs/models/seedance-2-5/image-to-video
    endpoint: bytedance/seedance-2.5/image-to-video
    input_map: seedance_i2v
    verified: false
    mcp_id: seedance_2_5
    mcp: { params: [aspect_ratio, duration, resolution, mode], fixed: { generate_audio: false }, roles: { start: start_image, end: end_image } }
    aliases: [Seedance 2.5, seedance_2_5]
    audio: off_switch
    # Two paths, both kept: the REST API takes start and end frames directly;
    # the web app and MCP connector need mode omni_reference for them.
    params: { start_image: true, end_image: true, rest_frames: direct, web_mcp_mode_with_frames: omni_reference, resolution: [720p] }
    use_for: [video_final]
    notes: Best faces; the final-quality video model. On the web app and MCP, start and end frames need mode omni_reference (the default rejects reference media); 720p, 10 s, audio off = 70 credits (verified live 2026-10-12).
  - ref: higgsfield/seedance-2.0
    label: Seedance 2.0
    kinds: [video, video_extend]
    max_refs: 0
    reference: https://docs.higgsfield.ai/docs/models/seedance-2/image-to-video
    endpoint: bytedance/seedance-2.0/image-to-video
    input_map: seedance_i2v
    verified: false
    mcp_id: seedance_2_0
    mcp: { params: [aspect_ratio, duration, resolution], fixed: { mode: std, generate_audio: false }, roles: { start: start_image, end: end_image } }
    aliases: [Seedance 2.0]
    audio: off_switch
  - ref: higgsfield/kling-3.0-standard
    label: Kling 3.0 Standard
    kinds: [video]
    max_refs: 0
    reference: https://docs.higgsfield.ai/docs/models/kling-3/standard-image-to-video
    endpoint: kling-video/v3.0/std/image-to-video
    input_map: kling_v3
    verified: false
    mcp_id: kling3_0
    mcp: { params: [aspect_ratio, duration], fixed: { mode: std, sound: 'off' }, roles: { start: start_image, end: end_image } }
    aliases: [Kling 3.0 Standard, Kling 3.0]
    audio: off_switch
    params: { start_image: true, end_image: true, mode: std, sound: [on, off], elements_need_start_image: true }
    notes: Element placeholders only work with a start image (verified live 2026-10-12).
  - ref: higgsfield/kling-3.0-pro
    label: Kling 3.0 Pro
    kinds: [video]
    max_refs: 0
    reference: https://docs.higgsfield.ai/docs/models/kling-3/pro-image-to-video
    endpoint: kling-video/v3.0/pro/image-to-video
    input_map: kling_v3
    verified: false
    mcp_id: kling3_0
    mcp: { params: [aspect_ratio, duration], fixed: { mode: pro, sound: 'off' }, roles: { start: start_image, end: end_image } }
    aliases: [Kling 3.0 Pro]
    audio: off_switch
    params: { start_image: true, end_image: true, mode: pro, sound: [on, off], elements_need_start_image: true }
    notes: Pro, sound off, 10 s = 15 credits (verified live 2026-10-12). Distorted Callie's face when she talked animatedly.
  - ref: higgsfield/kling-3.0-turbo
    label: Kling 3.0 Turbo
    kinds: [video]
    max_refs: 0
    reference: https://docs.higgsfield.ai/docs/models/kling-3/turbo-image-to-video
    endpoint: kling-video/v3.0-turbo/image-to-video
    input_map: kling_v3
    verified: false
    mcp_id: kling3_0_turbo
    mcp: { params: [aspect_ratio, duration, resolution], roles: { start: start_image } }
    aliases: [Kling 3.0 Turbo, kling3_0_turbo]
    audio: always_on
    params: { start_image: true, end_image: false, resolution: [720p, 1080p], duration_sec: [3, 15] }
    use_for: [video_test]
    notes: Cheap motion tests only; faces melt when the subject is small. Always generates audio (no off switch), so the Studio strips it on arrival (verified live 2026-10-12).
  - ref: higgsfield/wan-3.0
    label: Wan 3.0 Prime
    kinds: [video]
    max_refs: 0
    reference: https://docs.higgsfield.ai/docs/models/wan-3-prime/image-to-video
    endpoint: alibaba/wan-3.0-prime/image-to-video
    input_map: wan_i2v
    verified: false
    # From the connector's catalog (models_explore, 2026-10-13): duration 2
    # to 30 s, 480p/720p/1080p, start and end frames, native audio on unless
    # switched off.
    mcp_id: wan3_0_prime
    mcp: { params: [aspect_ratio, duration, resolution], fixed: { generate_audio: false }, roles: { start: start_image, end: end_image } }
    aliases: [Wan 3.0 Prime, wan3_0_prime]
    audio: off_switch
    params: { start_image: true, end_image: true, resolution: [480p, 720p, 1080p] }
  - ref: higgsfield/mirelo-sfx
    label: Mirelo text to audio (sound effects)
    kinds: [audio]
    max_refs: 0
    api: false
    endpoint: null
    input_map: generic_audio
    verified: false
    mcp_id: mirelo_text_to_audio
    mcp: { params: [duration] }
    aliases: [Mirelo, mirelo_text_to_audio]
    params: { duration_sec: true }
    use_for: [sfx]
    notes: Sound effects with a duration parameter; 12 s worked (verified live 2026-10-12). ElevenLabs flow SFX returned only 1 s clips. Not on the pay-per-use API (the official reference lists image and video only, 2026-10-13); runs through the Higgsfield account.

  # ── Clone Video (SPEC 13.1 R1): a source clip rebuilt with a character ──
  # Endpoints and fields from the official Model API Reference (read
  # 2026-10-13). The provider never keeps the source's sound: the Studio
  # puts it back itself when "Keep original sound" is on (free, the same for
  # every model). `clone.background` says where the result's place comes
  # from: the source clip ("video") or the character image ("image").
  # Two modes (owner, 2026-10-14, G28). "Replace the person" swaps only the
  # main subject and keeps the clip's place, light, crowd and outfit; it
  # gets REF-00 and one three-quarter view. "Copy the moves into a new
  # scene" (motion) gets one scene still of the character already in the
  # clip's place, never a bare sheet image.
  - ref: higgsfield/genjutsu-replace
    label: Genjutsu replace
    kinds: [video_clone]
    max_refs: 3
    api: false
    endpoint: null
    input_map: genjutsu_replace
    verified: false
    # generate_video with model hf_mult_replace_object: images in
    # image_references, exactly one clip in video_references, resolution
    # 480p, 720p or 1080p (models_explore and the backend's own validation
    # message, read 2026-10-14). The price needs the uploaded clip, so the
    # quote comes from the price book until the first run shows the charge.
    mcp_id: hf_mult_replace_object
    mcp: { params: [resolution], roles: { refs: image_references, video: video_references } }
    clone: { mode: replace, background: [video], image_refs: 3, min_sec: 3, max_sec: 30, prompt: optional }
    aliases: [Genjutsu replace, hf_mult_replace_object]
    charge_names: [Higgsfield Genjutsu - Object Swap]
    params: { resolution: [480p, 720p, 1080p] }
    use_for: [video_clone]
    notes: Your Higgsfield plan. Swaps only the person you pick and keeps the clip's place, light, crowd and outfit.
  # Recreate from a real clip, the motion step (owner, 2026-10-14): four
  # models, each on the Higgsfield plan (MCP) and on the Higgsfield API, so
  # every one keeps working when the plan lapses. Every model gets the same
  # inputs: the chosen still as the image reference, the cleaned clip as the
  # video reference, 720p, 9:16, audio off, the preset suggestion declined.
  # Genjutsu: on the plan generate_video with model hf_mult_motion_control
  # (the owner's proven route, a rave clip and a kitchen hair-flip clip); on
  # the API higgsfield/genjutsu/motion-transfer/v1.0 (video_url, image_urls
  # 1 to 8, prompt, resolution; source at least 4 s, longer than 30 s
  # trimmed; docs.higgsfield.ai, read 2026-10-14).
  - ref: higgsfield/genjutsu-motion-control
    label: Genjutsu
    kinds: [video_clone]
    max_refs: 1
    reference: https://docs.higgsfield.ai/docs/models/genjutsu/motion-transfer
    endpoint: higgsfield/genjutsu/motion-transfer/v1.0
    input_map: genjutsu_motion
    verified: false
    mcp_id: hf_mult_motion_control
    mcp: { params: [resolution], roles: { refs: image_references, video: video_references } }
    clone: { mode: motion, background: [image], image_refs: 1, min_sec: 4, max_sec: 30, prompt: optional }
    aliases: [Genjutsu, Genjutsu motion control, Higgsfield Genjutsu - Motion Transfer, hf_mult_motion_control]
    charge_names: [Higgsfield Genjutsu - Motion Transfer]
    params: { resolution: [480p, 720p, 1080p] }
    use_for: [video_clone]
    notes: The clip's real motion and camera onto the chosen still; her face held through the turns in the owner's tests.
  # Wan 3.0 and Wan 3.0 Prime, reference to video: on the plan generate_video
  # with wan3_0 or wan3_0_prime and the still in image_references, the clip
  # in video_references (models_explore, read 2026-10-14); on the API
  # alibaba/wan-3.0/reference-to-video and alibaba/wan-3.0-prime/
  # reference-to-video (prompt, image_urls up to 10, video_urls up to 5 of
  # 1 to 30 s, duration 2 to 30, resolution, aspect_ratio, generate_audio).
  - ref: higgsfield/wan-3.0-motion
    label: Wan 3.0
    kinds: [video_clone]
    max_refs: 1
    reference: https://docs.higgsfield.ai/docs/models/wan-3/reference-to-video
    endpoint: alibaba/wan-3.0/reference-to-video
    input_map: wan_reference
    verified: false
    mcp_id: wan3_0
    mcp: { params: [aspect_ratio, duration, resolution], fixed: { generate_audio: false }, roles: { refs: image_references, video: video_references } }
    clone: { mode: motion, background: [image], image_refs: 1, min_sec: 2, max_sec: 30, prompt: required }
    aliases: [Wan 3.0, wan3_0, Wan 3.0 Video]
    charge_names: [Wan 3.0 Video]
    audio: off_switch
    params: { resolution: [480p, 720p, 1080p] }
    use_for: [video_clone]
    notes: Follows the motion prompt closely; the cheapest of the four.
  - ref: higgsfield/wan-3.0-prime-motion
    label: Wan 3.0 Prime
    kinds: [video_clone]
    max_refs: 1
    reference: https://docs.higgsfield.ai/docs/models/wan-3-prime/reference-to-video
    endpoint: alibaba/wan-3.0-prime/reference-to-video
    input_map: wan_reference
    verified: false
    mcp_id: wan3_0_prime
    mcp: { params: [aspect_ratio, duration, resolution], fixed: { generate_audio: false }, roles: { refs: image_references, video: video_references } }
    clone: { mode: motion, background: [image], image_refs: 1, min_sec: 2, max_sec: 30, prompt: required }
    aliases: [Wan 3.0 Prime Motion, Wan 3.0 Prime Video]
    charge_names: [Wan 3.0 Prime Video]
    audio: off_switch
    params: { resolution: [480p, 720p, 1080p] }
    use_for: [video_clone]
    notes: Wan 3.0's higher tier.
  # Kling 3.0 Motion Control: on the plan the account tool motion_control
  # (its own tool, no prompt: image_id, motion_video_id, resolution 720p or
  # 1080p, scene_control image or video; read from the connector
  # 2026-10-13); on the API kling-video/v3/motion-control/std (image_url,
  # video_url of 3 to 30 s, prompt, keep_original_sound "no",
  # character_orientation; the output follows the clip's length).
  - ref: higgsfield/kling-3.0-motion-control
    label: Kling 3.0 Motion Control
    kinds: [video_clone]
    max_refs: 1
    reference: https://docs.higgsfield.ai/docs/models/kling-3-motion-control/std
    endpoint: kling-video/v3/motion-control/std
    input_map: kling_motion_control
    verified: false
    mcp_id: kling3_0_motion_control
    mcp: { tool: motion_control, params: [resolution] }
    clone: { mode: motion, background: [video, image], image_refs: 1, min_sec: 3, max_sec: 30, prompt: optional }
    aliases: [Kling 3.0 Motion Control, motion_control, Motion Control]
    charge_names: [Motion Control]
    params: { resolution: [720p, 1080p] }
    use_for: [video_clone]
    notes: The character follows the clip's motion and camera. On your plan it takes no prompt.
  # Wan 2.2 Animate, replace mode, on fal (fal-ai/wan/v2.2-14b/animate/
  # replace: video_url, image_url, resolution 480p, 580p or 720p; billed per
  # second of output at 16 fps; fal.ai docs): the clip keeps its place,
  # light and motion and the person becomes the kept still's. The API path's
  # "keep the place" motion step (item 19).
  - ref: fal/wan-2.2-animate-replace
    label: Wan 2.2 Animate replace
    kinds: [video_clone]
    max_refs: 1
    reference: https://fal.ai/models/fal-ai/wan/v2.2-14b/animate/replace/api
    endpoint: fal-ai/wan/v2.2-14b/animate/replace
    input_map: fal_wan_animate_replace
    verified: false
    clone: { mode: replace, background: [video], image_refs: 1, min_sec: 1, max_sec: 30, prompt: none }
    aliases: [Wan 2.2 Animate, Wan Animate replace]
    params: { resolution: [480p, 580p, 720p] }
    use_for: [video_clone]
    notes: fal, pay per second. Keeps the clip's place, light and moves; the person becomes the kept still's.
  # Kling 3.0 Motion Control (Pro) on fal (fal-ai/kling-video/v3/pro/
  # motion-control: image_url, video_url, character_orientation, prompt;
  # orientation "video" takes clips up to 30 s; fal.ai docs).
  - ref: fal/kling-3.0-motion-control
    label: Kling 3.0 Motion Control
    kinds: [video_clone]
    max_refs: 1
    reference: https://fal.ai/models/fal-ai/kling-video/v3/pro/motion-control/api
    endpoint: fal-ai/kling-video/v3/pro/motion-control
    input_map: fal_kling_motion_control
    verified: false
    clone: { mode: motion, background: [image], image_refs: 1, min_sec: 3, max_sec: 30, prompt: optional }
    aliases: [Kling 3.0 Motion Control (fal)]
    use_for: [video_clone]
    notes: fal, pay per second. The clip's motion and camera onto the kept still, in the still's place.
  # Kie.ai and WaveSpeed (owner, 2026-10-23; UX-PLAN.md section 40): more
  # providers for models the Studio already runs, and Seedance 1.5 Pro. The
  # request fields are from Kie's own OpenAPI files (read 2026-10-21) and
  # WaveSpeed's model pages (2026-10-23); none is confirmed by a run yet.
  # `endpoint` is the provider's model id. Which provider runs a step is
  # config/engines.yaml.
  - ref: kie/nano-banana-2.1
    label: Nano Banana 2.1
    kinds: [image, image_edit]
    max_refs: 10
    reference: https://docs.kie.ai/market/google/nanobanana2
    endpoint: nano-banana-2-1
    input_map: kie_nano_banana
    verified: false
    elements: false
    aliases: [Nano Banana 2.1 (Kie.ai)]
    params: { resolution: [1k, 2k, 4k] }
    notes: Kie.ai, pay per image in credits (200 = $1). Up to 10 reference images.
  - ref: wavespeed/nano-banana-2.1
    label: Nano Banana 2.1
    kinds: [image, image_edit]
    max_refs: 14
