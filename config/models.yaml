# Model catalog. A model ref is "provider/model". A Higgsfield REST endpoint
# is filled in only from Higgsfield's official Model API Reference, never from
# third-party copies of the catalog, and a model counts as confirmed only after
# one small paid test passes (Settings, Models: enter the path, then Test).
# Until then the adapter refuses to send live runs to it.
#
# Identity without training: Higgsfield Elements (reference characters) are
# instant and are used through a <<<element_id>>> placeholder in the prompt
# (verified live 2026-10-12). A character's element lives in its identity
# field, imported from the character file.
#
# Account path (the owner's Higgsfield account, plan credits): models with an
# mcp_id also run through the MCP connector. `mcp.params` lists the inputs
# the model accepts there (from models_explore, read 2026-10-13) and nothing
# else is sent; `mcp.fixed` is always sent (audio off for every video);
# `mcp.roles` names the media roles for references and start and end frames.
version: 1
models:
  # ── Higgsfield (primary, pay-per-use API) ──
  # Capabilities marked "verified live 2026-10-12" were confirmed by the
  # owner through the Higgsfield web app and MCP connector. REST endpoints
  # stay null (and the adapter refuses the model) until confirmed for the
  # pay-per-use API.
  - ref: higgsfield/gpt-image-2.5
    label: GPT Image 2.5
    kinds: [image, image_edit]
    max_refs: 8
    endpoint: null
    input_map: generic_image
    verified: false
    mcp_id: gpt_image_2_5
    mcp: { params: [aspect_ratio, resolution, quality, variant], roles: { refs: image_references } }
    aliases: [GPT Image 2.5, gpt_image_2_5, GPT Image 2.5 Sunburst]
    params: { variants: [flare, sunburst] }
    use_for: [hero, sheet]
    notes: Sheet model (Callie's sheet was built here). Variants flare and sunburst, verified live 2026-10-12.
  - ref: higgsfield/gpt-image-2.5-flare
    label: GPT Image 2.5 Flare
    kinds: [image, image_edit]
    max_refs: 8
    endpoint: null
    input_map: generic_image
    verified: false
    mcp_id: gpt_image_2_5
    mcp: { params: [aspect_ratio, resolution, quality], fixed: { variant: flare }, roles: { refs: image_references } }
    aliases: [GPT Image 2.5 Flare, Flare]
    params: { variant: flare }
    use_for: [scene_still]
    notes: Strong for stills; made Callie's best beach shot with real skin texture and the right ear cuff, though it once distorted her hair in a scene. Run it alongside Nano Banana 2.1 and pick the best.
  - ref: higgsfield/nano-banana-2.1
    label: Nano Banana 2.1
    kinds: [image, image_edit]
    max_refs: 4
    endpoint: null
    input_map: generic_image
    verified: false
    mcp_id: nano_banana_2_1
    mcp: { params: [aspect_ratio, resolution, seed, thinking_level], roles: { refs: image_references } }
    aliases: [Nano Banana 2.1, nano_banana_2_1]
    params: { resolution: [1k, 2k, 4k], thinking_level: true, inpaint: mask }
    use_for: [scene_still, expression_edit]
    notes: Best for scene stills and expression edits; held face and hair well with refs (verified live 2026-10-12). Re-composes the frame, so never use it to upscale.
  - ref: higgsfield/nano-banana-2
    label: Nano Banana 2
    kinds: [image, image_edit]
    max_refs: 4
    endpoint: null
    input_map: generic_image
    verified: false
    mcp_id: nano_banana_2
    mcp: { params: [aspect_ratio, resolution], roles: { refs: image_references } }
    aliases: [Nano Banana 2, Nano Banana Pro]
  - ref: higgsfield/soul-2
    label: Soul 2.0
    kinds: [image]
    max_refs: 0
    endpoint: /v1/text2image/soul
    input_map: soul_v1
    verified: false
    mcp_id: soul_2
    mcp: { params: [aspect_ratio, soul_id], fixed: { quality: 2k } }
    aliases: [Soul 2.0, Soul]
    notes: Soul 2.0 identity training failed or sat queued for hours (2026-10-12); never block on it. Use Elements instead.
  - ref: higgsfield/bytedance-upscale
    label: ByteDance image upscale (2k)
    kinds: [upscale]
    max_refs: 0
    endpoint: null
    input_map: generic_upscale
    verified: false
    mcp_id: bytedance
    mcp: { params: [], fixed: { resolution: 2k } }
    aliases: [ByteDance upscale, bytedance image upscale]
    params: { resolution: [2k] }
    use_for: [upscale, punch_in_crop]
    notes: 2 credits at 2k (verified live 2026-10-12). Use for punch-in crops of a wide still.
  - ref: higgsfield/seedance-2.5
    label: Seedance 2.5
    kinds: [video]
    max_refs: 0
    endpoint: null
    input_map: seedance_i2v
    verified: false
    mcp_id: seedance_2_5
    mcp: { params: [aspect_ratio, duration, resolution, mode], fixed: { generate_audio: false }, roles: { start: start_image, end: end_image } }
    aliases: [Seedance 2.5, seedance_2_5]
    audio: off_switch
    # Two paths, both kept: the REST API takes start and end frames directly;
    # the web app and MCP connector need mode omni_reference for them.
    params: { start_image: true, end_image: true, rest_frames: direct, web_mcp_mode_with_frames: omni_reference, resolution: [720p] }
    use_for: [video_final]
    notes: Best faces; the final-quality video model. On the web app and MCP, start and end frames need mode omni_reference (the default rejects reference media); 720p, 10 s, audio off = 70 credits (verified live 2026-10-12).
  - ref: higgsfield/seedance-2.0
    label: Seedance 2.0
    kinds: [video, video_extend]
    max_refs: 0
    endpoint: null
    input_map: generic_video
    verified: false
    mcp_id: seedance_2_0
    mcp: { params: [aspect_ratio, duration, resolution], fixed: { mode: std, generate_audio: false }, roles: { start: start_image, end: end_image } }
    aliases: [Seedance 2.0]
    audio: off_switch
  - ref: higgsfield/kling-3.0-standard
    label: Kling 3.0 Standard
    kinds: [video]
    max_refs: 0
    endpoint: null
    input_map: kling_v3
    verified: false
    mcp_id: kling3_0
    mcp: { params: [aspect_ratio, duration], fixed: { mode: std, sound: 'off' }, roles: { start: start_image, end: end_image } }
    aliases: [Kling 3.0 Standard, Kling 3.0]
    audio: off_switch
    params: { start_image: true, end_image: true, mode: std, sound: [on, off], elements_need_start_image: true }
    notes: Element placeholders only work with a start image (verified live 2026-10-12).
  - ref: higgsfield/kling-3.0-pro
    label: Kling 3.0 Pro
    kinds: [video]
    max_refs: 0
    endpoint: null
    input_map: kling_v3
    verified: false
    mcp_id: kling3_0
    mcp: { params: [aspect_ratio, duration], fixed: { mode: pro, sound: 'off' }, roles: { start: start_image, end: end_image } }
    aliases: [Kling 3.0 Pro]
    audio: off_switch
    params: { start_image: true, end_image: true, mode: pro, sound: [on, off], elements_need_start_image: true }
    notes: Pro, sound off, 10 s = 15 credits (verified live 2026-10-12). Distorted Callie's face when she talked animatedly.
  - ref: higgsfield/kling-3.0-turbo
    label: Kling 3.0 Turbo
    kinds: [video]
    max_refs: 0
    endpoint: null
    input_map: kling_v3
    verified: false
    mcp_id: kling3_0_turbo
    mcp: { params: [aspect_ratio, duration, resolution], roles: { start: start_image } }
    aliases: [Kling 3.0 Turbo, kling3_0_turbo]
    audio: always_on
    params: { start_image: true, end_image: false, resolution: [720p, 1080p], duration_sec: [3, 15] }
    use_for: [video_test]
    notes: Cheap motion tests only; faces melt when the subject is small. Always generates audio (no off switch), so the Studio strips it on arrival (verified live 2026-10-12).
  - ref: higgsfield/wan-3.0
    label: Wan 3.0 Prime
    kinds: [video]
    max_refs: 0
    endpoint: null
    input_map: generic_video
    verified: false
    audio: off_switch
  - ref: higgsfield/mirelo-sfx
    label: Mirelo text to audio (sound effects)
    kinds: [audio]
    max_refs: 0
    endpoint: null
    input_map: generic_audio
    verified: false
    mcp_id: mirelo_text_to_audio
    mcp: { params: [duration] }
    aliases: [Mirelo, mirelo_text_to_audio]
    params: { duration_sec: true }
    use_for: [sfx]
    notes: Sound effects with a duration parameter; 12 s worked (verified live 2026-10-12). ElevenLabs flow SFX returned only 1 s clips.

  # ── Mock (free, deterministic; tests and demo mode) ──
  - ref: mock/image
    label: Mock image
    kinds: [image, image_edit, upscale]
    max_refs: 8
    endpoint: mock
    input_map: mock
    verified: true
  - ref: mock/video
    label: Mock video
    kinds: [video, video_extend]
    max_refs: 0
    endpoint: mock
    input_map: mock
    verified: true

llm_models:
  - ref: anthropic/claude-opus-5-5
    label: Claude Opus 5.5
    api_model: claude-opus-5-5
    vision: true
  - ref: anthropic/claude-sonnet-5-5
    label: Claude Sonnet 5.5
    api_model: claude-sonnet-5-5
    vision: true
  - ref: anthropic/claude-haiku-5-5
    label: Claude Haiku 5.5
    api_model: claude-haiku-5-5
    vision: true
  - ref: mock/llm
    label: Mock LLM
    api_model: llm
    vision: true
