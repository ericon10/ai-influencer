# Model routing per pipeline task (SPEC 5.6 rule 41, 7.3). Data, not code.
# In demo mode every task routes to its mock equivalent (free).
version: 1
tasks:
  hero:          { model: higgsfield/gpt-image-2.5, kind: image, quality: high, resolution: 2k, aspect: "3:4" }
  sheet:         { model: higgsfield/gpt-image-2.5, kind: image_edit, quality: high, resolution: 2k }
  upscale:       { model: higgsfield/bytedance-upscale, kind: upscale, resolution: 2k }
  # Claude tasks. Sonnet 5.5 for all of them (owner, 2026-10-13); each can
  # be switched to another of claude_choices in Settings, Claude models.
  breakdown:     { model: anthropic/claude-sonnet-5-5, effort: medium, label: Inspiration breakdown, hint: What to keep and change from the inspiration photos. }
  concepts:      { model: anthropic/claude-sonnet-5-5, effort: high, label: Character concepts, hint: Writes the three character cards to pick from. }
  card_update:   { model: anthropic/claude-sonnet-5-5, effort: medium, label: Card check, hint: Compares the card with the picked hero. }
  scene_plan:    { model: anthropic/claude-sonnet-5-5, effort: medium, label: Scene planner, hint: Fills a scene's fields from your words (Plan it). }
  scene_ideas:   { model: anthropic/claude-sonnet-5-5, effort: low, label: Punch it up, hint: Three specific moments from a rough idea. }
  punch_up:      { model: anthropic/claude-sonnet-5-5, effort: low, label: Punch up, hint: Rewrites thin image lines to the density rule (before and after). }
  qa_perception: { model: anthropic/claude-sonnet-5-5, effort: medium, label: Check this, hint: The on-demand Claude check of a still or a take. }
  prompt_writer: { model: anthropic/claude-sonnet-5-5, effort: medium, label: Prompt writer, hint: Turns the scene details into the final still or video prompt., rule: scene-prompt-writer }
  content_writer: { model: anthropic/claude-sonnet-5-5, effort: low, label: Slides and captions, hint: Writes slideshow text and batch captions for the content builder. }
  # The line bank (UX-PLAN section 36, item 29): Haiku tags the comments,
  # Sonnet writes the lines, a separate Sonnet call reviews them, and Sonnet
  # puts a line in a character's voice.
  line_tagger:   { model: anthropic/claude-haiku-5-5, effort: low, label: Line bank tags, hint: Tags each kept comment (emotion, topic, pain point, who it fits, format, fight flag). }
  line_writer:   { model: anthropic/claude-sonnet-5-5, effort: medium, label: Line bank writer, hint: Turns each comment into an on-screen line. }
  line_reviewer: { model: anthropic/claude-sonnet-5-5, effort: low, label: Line bank reviewer, hint: Scores each line; under 8 never shows. }
  line_voice:    { model: anthropic/claude-sonnet-5-5, effort: low, label: Line in a voice, hint: Puts a bank line in the character's voice and checks it against their facts. }
# Models a Claude task can be switched to in Settings.
claude_choices: [anthropic/claude-sonnet-5-5, anthropic/claude-opus-5-5, anthropic/claude-haiku-5-5]
mock:
  image: mock/image
  video: mock/video
  llm: mock/llm
# Models to keep out of a task, per task (none at the moment).
avoid: {}
