# Text-overlay content builder (owner, 2026-10-13): meme videos, slideshows
# and batches, made from kept clips, stills and the owner's B-roll. Data,
# not code. Everything renders locally (ffmpeg on the worker), so only the
# Claude steps (slideshow text, batch captions) cost money.
version: 1

# The output frame: 9:16 at 1080x1920.
canvas: { width: 1080, height: 1920, fps: 30 }

# TikTok-style caption: a white rounded box per line, black text, centered,
# kept out of TikTok's own interface (the safe zones, in pixels at
# 1080x1920: the top bar, the caption and buttons at the bottom, the
# button column on the right).
caption:
  font: { file: tiktok-sans, weight: 600 }
  size: 56
  line_height: 1.3
  box: { fill: "#ffffff", text: "#000000", radius: 18, pad_x: 26, pad_y: 12 }
  max_width: 820
  max_lines: 7
  max_chars: 220
  safe: { top: 250, bottom: 480, left: 60, right: 160 }
  # Where the caption sits inside the safe area: top, upper_third, middle
  # or bottom. Upper third by default (owner, 2026-10-14) so it stays off
  # her mouth and hands.
  position: upper_third
  # box (TikTok's white box) or outline (white text, black stroke, TikTok
  # Classic). Each post can switch; the plain style is for text behind her.
  style: box
  outline: { text: "#ffffff", stroke: "#000000", width: 0.11 }
  karaoke: { fill: "#ffd60a", text: "#000000", color: "#ffd60a" }

meme:
  # The clip plays in full; B-roll is cut in hard (never a crossfade).
  max_clip_seconds: 30
  broll_seconds: 6
  max_broll_seconds: 20
  order: clip_first

broll:
  # Phone recordings and screen captures; converted on the worker to a
  # lean H.264 copy without sound.
  max_upload_mb: 200
  max_seconds: 120

slideshow:
  slides: [5, 7]
  # At most 5 hashtags (owner, 2026-10-16).
  hashtags: [3, 5]
  max_stills: 10
  image: { quality: 90 }
  # The power-up (owner, 2026-10-16; UX-PLAN.md section 27). A draft makes
  # 6 slides by default (3 to 10 in the Slides step). Stills are made at
  # 9:16 (TikTok) or 3:4 (Instagram); the export makes both sizes.
  draft_slides: 6
  hooks: 10
  instagram: { width: 1080, height: 1440 }
  # The stills (owner, 2026-10-17; UX-PLAN.md section 30). The path is the
  # owner's pick on the Stills step and the Launch plan card: Your
  # Higgsfield plan (credits) or the Higgsfield API (dollars); the last
  # pick is kept, the plan when it is connected. The model follows who is
  # in the slide. A slide that shows the character uses the character
  # file's stills default (its Models section), else scenes.yaml
  # default_still_model, at the Standard level. A slide with no one in it
  # (a topic slideshow, or a shot with no person) uses the cheapest of
  # these that the path can run, priced from the price book at the
  # Standard level (GPT Image 2.5 Flare today: 1 credit, or $0.0625).
  # Soul 2.0 is left out (2026-10-22): it is cheaper on the plan (0.12
  # credits) but takes no reference image, so it cannot hold a set's look
  # picture (the same place in every photo).
  empty_still_models: [higgsfield/gpt-image-2.5-flare, higgsfield/nano-banana-2.1]
  max_variations: 5
  batch_max: 10
  # Mock screens (special slides) never show a real brand: each name here
  # becomes the generic name at the same place in the second list.
  brand_names: [Google, Gmail, Amazon, Meta, Facebook, Apple, iMessage, Microsoft, Outlook, LinkedIn, Indeed, Glassdoor, WhatsApp, Instagram, TikTok, Snapchat, Netflix, Spotify, Uber, Tesla, Slack, Zoom, Deloitte, McKinsey, Goldman Sachs, JPMorgan, Starbucks, Walmart, Target, Nike, Adidas, Airbnb, Stripe, Shopify, Salesforce, Oracle, IBM, Intel, Nvidia, OpenAI, Notion, Workday, ZipRecruiter, Handshake]
  generic_names: [Northwind, Mail, Bluepeak, Brightline, Harbor, Messages, Cobalt, Inbox, Careerline, Jobfinder, Workwise, Chat, Photos, Social, Video, Snaps, Streamline, Music, Rides, Volt, Team Chat, Meetings, Crestview Partners, Summit Advisory, Oakridge Capital, Granite Bank, Corner Coffee, Everyday Mart, Bullseye Goods, Stride, Motion, Stayhost, Payflow, Shopsmith, Cloudline, Datacore, Bluechip, Chipworks, Pixelcore, Thinkbox, Notes, Peopleworks, Jobmatch, Campus Jobs]

# The viral writing playbook (owner, 2026-10-16; UX-PLAN.md section 28):
# each account's primary and backup structure or lens, the playbook's fit
# table (section 4) as starting points. The key is the account tag or its
# character's name; edit them per account on the Accounts card (a default,
# never a lock).
playbook:
  fit:
    F1: [S3, S11]
    F2: [L14, S1]
    F3: [S11, L20]
    F4: [S11, S3]
    F5: [S3, L18]
    F6: [S6, S1]
    F7: [S12, S4]
    F8: [S9, L24]
    F9: [S2, L21]
    CALLIE: [S5, S10]
    SOLEI: [S2, S6]

# Writing rules by product (owner, 2026-10-17; UX-PLAN.md section 29).
# Every post is written to the general standard (the stop test, one story
# thread, the clarity test, an image line a slide, the voice from the
# character's voice card or the account; one Claude call for hooks, no
# reviewer). A product can add its own rules on top: it picks one of these
# on its card (Library > Hooks). A post follows its own product's; a post
# with no product gets the general standard only. A standard's templates
# are the ones named with its key first in config/templates.yaml
# (sidestep_slideshow_hooks); a name it has no version of falls back to the
# general one. `names`: a product of that name starts on it (kit import).
writing_standards:
  sidestep:
    label: SideStep rules v1.2 (job word, pain 7+, honest endings)
    names: [SideStep]
    # The owner's own product: no other account can pick it or get it by
    # naming a product SideStep (multi-user, 2026-10-24).
    owner_only: true
    # The five-check stop test and the ladder after Write 10 (a second call).
    review: true
    # The language notes (copy_lint below) on its posts' words.
    lint: true
    # The honest endings on a product post's last slide.
    endings: true
    # The playbook's structures per account (playbook above).
    structures: true
    # The ICP's pain points (the kit's buyer language, section 2, and the
    # honest endings): the line bank tags each comment with one of these.
    pains:
      - applied everywhere and heard nothing back
      - ghosted after the interviews
      - ghost jobs and reposted listings
      - entry level that wants years of experience
      - rejected by a bot before a human saw it
      - endless interview rounds and unpaid take-homes
      - retyping the resume into boxes
      - rewriting the resume for every job
      - hours on jobs you don't fit
      - lowball pay and "competitive" salary
      - money running out while searching
      - family and friends asking how the search is going
      - feeling like it's you
      - laid off out of nowhere

# The line bank (owner, 2026-10-22; UX-PLAN.md section 36, item 29): the
# free first pass on an Apify comment scrape (code only), the tags Claude
# gives each kept comment, and the reviewer's bar. Every list is data.
line_bank:
  # The free first pass drops comments with fewer likes, fewer words, or
  # none of the topic words (the job search).
  min_likes: 2
  min_words: 4
  # An on-screen line reads in about 2 seconds (6 s clips): this many words.
  max_words: 12
  # The reviewer's bar: gut punch, specificity and "would a real person
  # post this" all at least this (1 to 10), and not setup or meh.
  pass_score: 8
  # Comments per batch: one tag call, one writer call and one reviewer call
  # each.
  tag_batch: 30
  # Kept and rejected lines given to the writer and the reviewer.
  examples: 8
  emotions: [infuriated, angry, sad, crying, frustrated]
  topics: [layoff, ghosting, interviews, applications, money, family, burnout, entry level, AI, bosses, quitting, small wins]
  formats: [finished damage, meme setup, question, list]
  fits:
    - { id: first, label: Unemployed, first person }
    - { id: secondhand, label: Secondhand (for the girls) }
    - { id: both, label: Both }
  # On the job search: a comment needs one of these (whole words; a phrase
  # matches as written), or a theme from the scrape's themes column.
  topic_words: [job, jobs, work, working, worked, workplace, laid me off, laid us off, laid her off, let me go, let go, fired me, my replacement, hire, hired, hiring, interview, interviews, interviewed, recruiter, recruiters, resume, resumes, cv, application, applications, apply, applied, applying, unemployed, unemployment, laid off, layoff, layoffs, fired, boss, bosses, manager, hr, salary, paycheck, pay, paid, wage, wages, minimum wage, rent, bills, quit, quitting, career, degree, graduate, graduated, grad, college, entry level, intern, internship, linkedin, indeed, offer, rejected, rejection, rejections, ghosted, ghosting, onboarding, promotion, company, office, shift, shifts, coworker, coworkers, severance, benefits, ai, experience, qualified, overqualified, underqualified, position, role, employer, employed, broke, savings, retail, corporate, 9 to 5, 9-5, two weeks notice, contract, non-compete, hours, payroll, workforce, job market, market]
  # About the video itself, not the job search (dropped).
  video_words: [this audio, the audio, this sound, the sound, this song, the song, the music, this video, the video, ur video, your video, the edit, this edit, the filter, the trend, the caption, part 2, pt 2, who's here, whos here, your outfit, her outfit, your hair, her hair, your nails, her nails, your makeup, her makeup, your voice, her voice, your face, her face, the way she, the way you said, your eyes, so pretty, so cute, you're gorgeous, ur gorgeous, slay, ate this]
  # Another language in Latin letters: two or more of these, and no more
  # English words than them, is not English.
  foreign_words: [na, ng, ko, po, ang, mga, sa, kasi, tas, naman, nga, yung, lang, talaga, ako, ikaw, que, el, los, las, por, para, pero, muy, mi, tu, es, una, uno, con, del, nao, não, você, voce, mas, isso, eu, ich, und, nicht, das, ist, je, pas, est, les, une]
  english_words: [the, a, i, you, my, me, to, and, of, is, it, in, that, for, was, on, they, so, but, just, like, at, this, have, be, are, not, with, what, we, when, all, do, don't, i'm, im, get, got, if, no, she, he, her, his, them, or, how, why, ur, u]
  # The voice card's who and point of view: one of these means the
  # character tells the line in the first person (unemployed); otherwise
  # secondhand.
  first_person_words: [unemployed, laid off, job hunting, job-hunting, looking for work, job search, job seeker, between jobs, out of work, applying, fresh grad, new grad, recent grad]

# Weeks (owner, 2026-10-22; UX-PLAN.md section 37): the fill rules, the
# blends, the accounts' defaults and the Drive layout. Every value is a
# default the owner can change; none is about one character in code.
weeks:
  # Fill rules a and c: no pain twice within an account's last this many
  # posts; emotion and format never this many + 1 alike in a row.
  rules: { pain_window: 7, max_run: 2 }
  # The life % of each account's week, by its character's name (life/job,
  # Callie 70/30...). Edited per account on the Accounts page.
  blend_defaults: { Callie: 70, Dani: 80, Solei: 90, Doug: 0 }
  blend_fallback: 50
  slots_per_day: 3
  platforms: [tiktok, instagram, youtube]
  # Import lines: two lines are the same when this share of the shorter
  # one's words are in the other.
  near_duplicate: 0.8
  # The AI label line added to each caption sent to Drive, when the
  # character file's disclosure is an instruction rather than a line.
  ai_label: 'AI-generated'
  # A person post's default settings for a drafted scene, when its
  # character file has none of its own.
  settings: ['her bedroom, an unmade bed, daylight from one window', 'a small kitchen, the counter cluttered, morning light', 'the front seat of her parked car', 'the couch in her living room at night, one lamp on']
  # The place fit (UX-PLAN.md section 43): a theme ties a kind of line to a
  # kind of place, so New post and Fill suggest the places that suit the
  # line first (a money line: the gas station). Words match whole on the
  # plain text; a word ending in * matches its start. Any character's place
  # bank and settings use them; edit freely.
  place_themes:
    - id: money
      line: [money, rent, broke, paycheck*, bill, bills, cash, afford, savings, overdraft, budget, price*, cost*, dollar*, bucks, unemployment check, gas money, spent, spend, pay*, wage*, salary, loan*, debt, credit card, bank account]
      place: [gas station, gas pump, pumps, canopy, register, roller grill, hot dogs, atm, dollar store, grocery, checkout, wallet]
    - id: job search
      line: [interview*, recruiter*, applied, application*, apply, resume, hiring, rejected, rejection, ghosted, offer, portal, linkedin, job, jobs, laid off, layoff, fired, hired, unemployed]
      place: [kitchen table, laptop, desk, mailbox, office, parking lot, chair, waiting room]
    - id: night
      line: [night, sleep, awake, insomnia, 1am, 2am, 3am, 4am, midnight, lonely, alone, tired]
      place: [bed, bedroom, lamp, night, dark, pillow*, 1am, fridge]
    - id: food
      line: [eat, ate, eating, dinner, lunch, breakfast, ramen, food, hungry, groceries, meal*]
      place: [ramen, bowl, fridge, refrigerator, kitchen, fries, hot dogs, plate, counter]
    - id: driving
      line: [drive, drove, driving, car, commute, highway, road, gas tank, tank]
      place: [car, sedan, windshield, highway, road, passenger seat, dashboard, parking lot]
    - id: family
      line: [mom, dad, mother, father, parents, sister, brother, family, grandma, holiday*, thanksgiving, christmas]
      place: [couch, living room, driveway, porch, front door, mailbox, dining table]
  drive:
    week_folder: 'week of {date}'
    manifest: 'manifest {date}'

# The language lint (owner, 2026-10-16; UX-PLAN.md section 28): free
# warnings on the hooks, slides and captions of posts whose product's
# writing standard has lint on (section 29: SideStep's); the em and en dash
# check runs on every post. Each check is a default in Settings > Rules;
# these are its word lists. The post's own product is the name never in a
# hook.
copy_lint:
  values: [should, need to, needs to, must, ought]
  hype: [dream job, unlock, level up, game-changer, game changer, supercharge]
  products: []
  max_hashtags: 5
  # THE STANDARD: slide 1 reads in one go. The writer aims for about 15
  # words; the note shows over 22 (owner, 2026-10-16: the v1.2 passing
  # examples, 14 to 22 words, are the bar). Slide 1 never opens with a
  # label or a stage direction (a timestamp or date is found by code).
  hook_max_words: 22
  hook_labels: [Exhibit, Levels of, Previously on, Calendar invite]
  # THE STANDARD v1.2: every hook names the job situation (one of these, or
  # a word starting with one); a product post's last slide never says these.
  job_words: [job, interview, recruiter, offer, salary, salaries, resume, résumé, hiring, application]
  ending_never: [ghosted, ghosting, passed over, applies for you, apply for you, applies for me, applying for you, auto-apply, auto apply]
  # Line lint (owner, 2026-10-22; UX-PLAN.md section 35, item 5), on every
  # post's slide 1 and on-screen line: a line that opens on one of these
  # setups (with no feeling in its first words), and a line with none of the
  # emotion words (a word starting with one counts: infuriat, frustrat).
  setup_openers: [so, okay so, ok so, when, me when, story time, storytime, let me tell you, "here's", here is, this is, imagine, remember when, once, one time, yesterday, today, the other day, last week, after, before, if you, what happens when, pov, day 1, part 1, a thread, quick story]
  emotion_words: [angry, anger, furious, fuming, infuriat, livid, rage, raging, mad, pissed, seething, sad, sadness, cried, cry, crying, sobbing, tears, heartbroken, devastat, gutted, crushed, grief, lonely, frustrat, fed up, sick of, over it, exhausted, drained, burned out, burnt out, humiliat, embarrass, ashamed, shame, terrified, scared, afraid, panic, anxious, dread, hate, hopeless, defeated, numb, broken, shaking, screaming, scream, betrayed, insulted, disgust, miserable, jealous, bitter, spiral]

# Results (owner, 2026-10-17; UX-PLAN.md section 32): the decision hints on
# a post's card and in Posts home > Results, never automatic (the
# playbook's tiers, section 11). A post at variations_views or more: "50K+
# views: make 3 variations". A hook family (a post, its variations and the
# posts that share its plan moment) with drop_posts posts under drop_views:
# "Under 1K twice: drop the hook family".
results:
  variations_views: 50000
  variations_count: 3
  drop_views: 1000
  drop_posts: 2

# Download day (owner, 2026-10-17; UX-PLAN.md section 33): the plan's slots
# as clock times, for the posting order and the folder names (1-AM-0900).
# Starting points: change them on the Download day card (kept per account).
posting:
  slot_times: { AM: "09:00", Daily: "12:00", PM: "18:00" }

batch:
  # Up to 50 videos (Phase 4: batch at scale); each is its own short job on
  # the worker. The download is a zip in parts of at most zip_part_mb.
  max: 50
  default_count: 20
  zip_part_mb: 150

# Clone Video (SPEC 13.1 R1; UX-PLAN.md: "Clone a TikTok or Reel" in the
# Video step). A saved TikTok or Reel is rebuilt with the post's character,
# or several at once (one quote, a line each). Every choice is a default.
clone:
  # Two modes (owner, 2026-10-14, G28). "Replace the person (keep the
  # scene)" is the default: only the person you pick changes; the clip's
  # place, light, crowd and outfit stay. "Copy the moves into a new scene"
  # first makes a scene still of the character in the clip's place (shown
  # before the run), then copies the moves onto it.
  mode: replace
  # Replace: Genjutsu replace on your Higgsfield plan, Seedance 2.5 video
  # edit on the API. Copy the moves: Kling 3.0 Motion Control on your plan,
  # Kling 3.0 Motion Control Pro on the API. The last pick per mode is
  # remembered.
  model: higgsfield/seedance-2.5-video-edit
  account_model: higgsfield/genjutsu-replace
  # Recreate from a real clip, the motion step (owner, 2026-10-14): four
  # models, each on the Higgsfield plan or the API (whichever works), with
  # the last one used pre-selected; Wan 3.0 until there is one.
  motion_model: higgsfield/wan-3.0-motion
  models:
    - { ref: higgsfield/genjutsu-motion-control, resolution: 720p }
    - { ref: higgsfield/wan-3.0-motion, resolution: 720p }
    - { ref: higgsfield/wan-3.0-prime-motion, resolution: 720p }
    - { ref: higgsfield/kling-3.0-motion-control, resolution: 720p }
    - { ref: higgsfield/genjutsu-replace, resolution: 720p }
    - { ref: higgsfield/seedance-2.5-video-edit, resolution: 720p }
    # The API path without a Higgsfield plan (item 19): fal.
    - { ref: fal/wan-2.2-animate-replace, resolution: 720p }
    - { ref: fal/kling-3.0-motion-control }
    - { ref: higgsfield/kling-o3-video-edit }
  # The outfit: the one in the clip (default) or one of the character's
  # stills.
  outfit: source
  # Before cloning, the clip is cleaned (free, on the worker): TikTok's end
  # card is trimmed and burned-in captions and the bouncing handle
  # watermark are filled in from around them. A default: the Clone panel
  # can undo it per clip, and this switches it off for the account.
  cleanup: true
  # The face images a replace gets: REF-00 and the first approved
  # three-quarter view, never the rest of the sheet (G28).
  face_refs: [REF-00, REF-01, REF-02]
  # The scene still for "Copy the moves": the clip's first frame edited to
  # put the character in place of the person you picked.
  # Mass recreate (owner, 2026-10-22, item 24): a TikTok link in the sheet
  # is fetched as its video through the owner's Apify account.
  mass:
    fetch_model: apify/tiktok-video
  scene_still:
    model: higgsfield/nano-banana-2.1
    # Without the plan, Nano Banana 2.1 runs on Google AI Studio (the same
    # model, pay per image), then Seedream 4.5 edit on fal as the fallback.
    # GPT Image 2.5 is out of Recreate (owner, 2026-10-22, item 18): OpenAI
    # refuses edits of a real person's photo. Flare stays for heroes, sheets
    # and slideshow stills.
    api_model: google/nano-banana-2.1
    fallback_model: fal/seedream-4.5-edit
    fallback_note: untested for recreates
  # Recreate from a real clip: the frame (seconds in), the takes, and what
  # suggests the route (a dark clip or a lot of movement, read free).
  recreate:
    frame_at: 0.2
    takes: 4
    face_takes: 2
    # "Make 4 stills" runs the face pass (face_takes) on the best still in
    # the same price, unless skipped (owner, round 17: both proven hand runs
    # needed it).
    face_pass: true
    dark_luma: 70
    busy_motion: 14
    # The gates before any video spend (fixed, owner 2026-10-14; margin in
    # round 17): the chosen still matches REF-00 at face_min or more, the
    # face match beats its likeness to the person in the clip by margin or
    # more, and the likeness stays under source_max. Calibrated with the
    # Studio's matcher on the two proven hand-run stills against REF-00 and
    # the frame each was made from: kitchen face 0.711, likeness 0.263
    # (margin 0.448); rave face 0.537, likeness 0.370 (margin 0.167). The
    # rave still before its face pass must fail: face 0.454, likeness 0.568
    # (margin -0.114). The old 0.36 cap alone would have blocked the proven
    # rave still.
    gate: { face_min: 0.45, margin: 0.12, source_max: 0.45 }
    # The face pass is skipped, and not charged, when the best still already
    # beats the clip's person by this margin (owner, 2026-10-15). A take is
    # read against the same numbers as a still (the video rule) until a gate
    # check gives video its own; a take that misses is a warning, never
    # rejected.
    face_skip_margin: 0.3
    # The video: 720p, 9:16 for a vertical clip, audio off.
    resolution: 720p
    # The review: the face checked every review_step seconds; text found on
    # frames every ocr_step seconds; a cut where the picture changes more
    # than cut_threshold (ffmpeg's scene score, 0 to 1).
    review_step: 0.5
    ocr_step: 1
    cut_threshold: 0.35
    # A batch of recreates: up to batch_max rows.
    batch_max: 20
    # What one credit is worth on the Higgsfield API (1.5 credits = $0.094,
    # its billing docs), to count API dollars against a post's credit cap.
    credit_usd: 0.0625
  # The source clip: cut to max_seconds on arrival (with its sound, kept for
  # "Keep original sound"); shorter than min_seconds is refused.
  min_seconds: 3
  max_seconds: 30
  max_upload_mb: 200
  max_characters: 5
  # Off by default, like every video (owner ruling G1).
  keep_sound: false


# Chaining (Phase 3; SPEC 4.3 and 5.4 rule 33): "Continue this shot" in the
# Video step. The kept clip's last frame (full size; stepped back about half
# a second when it is blurry) starts the next take on the same model, and
# the takes are joined into one longer clip. Seams are scored and never
# crossfaded: cut, grade, or fail the seam.
chain:
  max_parts: 4
  max_seconds: 40
  step_back_sec: 0.5
  # Largest difference (1 - SSIM) that still cuts cleanly at a seam.
  max_seam_diff: 0.18

# The sound bed (Phase 3; SPEC 5.5): ambience (Room tone is built in, or a
# recording the owner uploaded) and an optional music track the owner
# uploaded, ducked under the clip's own sound. Mixed locally with ffmpeg and
# normalized to social loudness. No AI music, ever by default.
sound:
  # Integrated loudness of the finished post when it has music or the
  # clip's own sound (TikTok, Reels and Shorts all play around -14 LUFS).
  target_lufs: -14
  true_peak: -1
  # A post with ambience only stays quiet: a room, not a soundtrack.
  ambience_only_lufs: -28
  # Levels each layer is set to before the mix (then the mix is normalized).
  ambience_lufs: -30
  music_lufs: -20
  # The owner's level choices, in dB on top of those.
  levels: { quiet: -6, normal: 0, loud: 4 }
  # Ducking: the music dips while the clip's own sound plays.
  duck: { threshold: 0.03, ratio: 8, attack_ms: 20, release_ms: 400 }
  # New posts start with Room tone and no music.
  default_ambience: room
  max_upload_mb: 50
  max_seconds: 600
  # Voice lines (overnight item 4): the owner's performed takes turned into
  # the character's voice (ElevenLabs speech to speech, with word timings).
  # The voiceover sits here before the mix; the music and ambience dip
  # under it. Captions follow the words a few at a time.
  voice:
    model: elevenlabs/sts-v2
    lufs: -16
    max_seconds: 60
    max_takes: 50
    phrases: { max_words: 6, max_sec: 2.4, pause_sec: 0.35, hold_sec: 0.6 }

# The rough cut (Phase 3): the post's clips, B-roll and captions on one
# timeline in the Finish step, built automatically from the steps above.
cut:
  max_seconds: 90
  max_shots: 12
  max_captions: 8

# Export for (long run part 4, owner 2026-10-15): one preset per app, picked
# in the Finish step and remembered by the post. Each sets the length cap
# (never longer than cut.max_seconds), a cap on the video bitrate (a file
# over it is encoded again at the cap, so uploads stay small and are not
# squeezed twice) and the loudness the sound ends at. Starting points, not
# platform rules: change them here.
export_presets:
  - { id: tiktok, label: "TikTok", max_seconds: 90, video_kbps: 12000, lufs: -14, true_peak: -1 }
  - { id: reels, label: "Reels", max_seconds: 90, video_kbps: 10000, lufs: -14, true_peak: -1 }
  - { id: shorts, label: "Shorts", max_seconds: 60, video_kbps: 10000, lufs: -14, true_peak: -1 }

# Hook variants (long run part 4): the same timeline exported once per
# hook, each hook over the first `seconds` in place of a caption there.
hook_variants: { max: 3, seconds: 2 }

# The cover (long run part 4): a frame of the exported video with the
# cover text in the caption look, as a JPEG for the app's cover upload.
cover: { quality: 90 }
