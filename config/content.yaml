# Text-overlay content builder (owner, 2026-10-13): meme videos, slideshows
# and batches, made from kept clips, stills and the owner's B-roll. Data,
# not code. Everything renders locally (ffmpeg on the worker), so only the
# Claude steps (slideshow text, batch captions) cost money.
version: 1

# The output frame: 9:16 at 1080x1920.
canvas: { width: 1080, height: 1920, fps: 30 }

# TikTok-style caption: a white rounded box per line, black text, centered,
# kept out of TikTok's own interface (the safe zones, in pixels at
# 1080x1920: the top bar, the caption and buttons at the bottom, the
# button column on the right).
caption:
  font: { file: tiktok-sans, weight: 600 }
  size: 56
  line_height: 1.3
  box: { fill: "#ffffff", text: "#000000", radius: 18, pad_x: 26, pad_y: 12 }
  max_width: 820
  max_lines: 7
  max_chars: 220
  safe: { top: 250, bottom: 480, left: 60, right: 160 }
  # Where the caption sits inside the safe area: top, upper_third, middle
  # or bottom. Upper third by default (owner, 2026-10-14) so it stays off
  # her mouth and hands.
  position: upper_third
  # box (TikTok's white box) or outline (white text, black stroke, TikTok
  # Classic). Each post can switch; the plain style is for text behind her.
  style: box
  outline: { text: "#ffffff", stroke: "#000000", width: 0.11 }
  karaoke: { fill: "#ffd60a", text: "#000000", color: "#ffd60a" }

meme:
  # The clip plays in full; B-roll is cut in hard (never a crossfade).
  max_clip_seconds: 30
  broll_seconds: 6
  max_broll_seconds: 20
  order: clip_first

broll:
  # Phone recordings and screen captures; converted on the worker to a
  # lean H.264 copy without sound.
  max_upload_mb: 200
  max_seconds: 120
  products: []

slideshow:
  slides: [5, 7]
  hashtags: [3, 6]
  max_stills: 10
  image: { quality: 90 }

batch:
  # Up to 50 videos (Phase 4: batch at scale); each is its own short job on
  # the worker. The download is a zip in parts of at most zip_part_mb.
  max: 50
  default_count: 20
  zip_part_mb: 150

# Clone Video (SPEC 13.1 R1; UX-PLAN.md: "Clone a TikTok or Reel" in the
# Video step). A saved TikTok or Reel is rebuilt with the post's character,
# or several at once (one quote, a line each). Every choice is a default.
clone:
  # Defaults that keep the clip's own place, so a clone from REF-00 alone
  # is a full scene: Kling 3.0 Motion Control on your Higgsfield plan,
  # Seedance 2.5 video edit on the API. The last pick is remembered.
  model: higgsfield/seedance-2.5-video-edit
  account_model: higgsfield/kling-3.0-motion-control
  models:
    - { ref: higgsfield/kling-3.0-motion-control, resolution: 720p }
    - { ref: higgsfield/kling-3.0-motion-control-pro }
    - { ref: higgsfield/kling-3.0-motion-control-standard }
    - { ref: higgsfield/genjutsu-motion-transfer, resolution: 720p }
    - { ref: higgsfield/seedance-2.5-video-edit, resolution: 720p }
    - { ref: higgsfield/kling-o3-video-edit }
  # The source clip: cut to max_seconds on arrival (with its sound, kept for
  # "Keep original sound"); shorter than min_seconds is refused.
  min_seconds: 3
  max_seconds: 30
  max_upload_mb: 200
  max_characters: 5
  # Off by default, like every video (owner ruling G1).
  keep_sound: false


# Chaining (Phase 3; SPEC 4.3 and 5.4 rule 33): "Continue this shot" in the
# Video step. The kept clip's last frame (full size; stepped back about half
# a second when it is blurry) starts the next take on the same model, and
# the takes are joined into one longer clip. Seams are scored and never
# crossfaded: cut, grade, or fail the seam.
chain:
  max_parts: 4
  max_seconds: 40
  step_back_sec: 0.5
  # Largest difference (1 - SSIM) that still cuts cleanly at a seam.
  max_seam_diff: 0.18

# The sound bed (Phase 3; SPEC 5.5): ambience (Room tone is built in, or a
# recording the owner uploaded) and an optional music track the owner
# uploaded, ducked under the clip's own sound. Mixed locally with ffmpeg and
# normalized to social loudness. No AI music, ever by default.
sound:
  # Integrated loudness of the finished post when it has music or the
  # clip's own sound (TikTok, Reels and Shorts all play around -14 LUFS).
  target_lufs: -14
  true_peak: -1
  # A post with ambience only stays quiet: a room, not a soundtrack.
  ambience_only_lufs: -28
  # Levels each layer is set to before the mix (then the mix is normalized).
  ambience_lufs: -30
  music_lufs: -20
  # The owner's level choices, in dB on top of those.
  levels: { quiet: -6, normal: 0, loud: 4 }
  # Ducking: the music dips while the clip's own sound plays.
  duck: { threshold: 0.03, ratio: 8, attack_ms: 20, release_ms: 400 }
  # New posts start with Room tone and no music.
  default_ambience: room
  max_upload_mb: 50
  max_seconds: 600

# The rough cut (Phase 3): the post's clips, B-roll and captions on one
# timeline in the Finish step, built automatically from the steps above.
cut:
  max_seconds: 90
  max_shots: 12
  max_captions: 8
