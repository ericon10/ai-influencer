# Prompt templates (SPEC 10). {braces} are filled by the engine from the
# character record; LLMs never write these prompts from scratch.
#
# Realism principle (rule zero): hero and sheet shots are bare-faced. Code
# adds "Bare face, no makeup, no retouching." and the REALISM and AVOID
# blocks to every hero and sheet prompt, so editing these templates cannot
# remove them (server/core/realism.ts).
# Pronoun placeholders: {subj} she, {obj} her, {poss} her, {noun} woman.
version: 1

hero:
  # How Callie's REF-00 was made: text only from the card, never the
  # inspiration image (SPEC 5.1 rule 1); chest-up, facing the camera, relaxed
  # neutral expression in all three prompts. Imperfections at the dose of a
  # real person on a good day, never stacked.
  # {background} is the default rule sheet-background (editable in Settings,
  # Rules; empty when switched off).
  base: |
    Chest-up portrait of {card}. {variant} {background} Plain white crew-neck
    tee, hair in its usual style.
    {marks}
    Photorealistic, natural skin with visible pores and small believable
    imperfections.
  variants:
    - "Facing the camera, relaxed neutral expression."
    - "Facing the camera, relaxed neutral expression, mouth softly closed."
    - "Facing the camera, relaxed neutral expression, chin level, eyes on the lens."

sheet:
  base: |
    Using the attached reference images, keep this {noun}'s face, hair, skin
    tone, and distinguishing marks exactly the same. {framing}. {view}.
    {marks}
    {expression}{body} {background} {Outfit}. Photorealistic, natural skin
    with visible pores and the same
    small imperfections as the reference. Same person as the reference, not
    a lookalike.

framing:
  chest_up: "Chest-up framing, from mid-chest to just above the top of the head"
  full_body: "Full-body framing, standing, the whole body visible from head to toe with a little space above and below"

outfit:
  chest_up: "wearing a simple white crew-neck t-shirt"
  full_body: "wearing a simple white crew-neck t-shirt tucked into high-rise blue jeans and plain white sneakers"

# Full-body shots only (SPEC 5.1 rules 9 and 10).
body_line: " Build: {body}. The tee is tucked in so the waist reads."

expressions:
  neutral: "Relaxed neutral expression, mouth closed."
  open_smile: "Natural open smile showing teeth, eyes slightly crinkled."
  laughing: "Laughing naturally, eyes crinkled, head tipped slightly back."
  serious_down: "Serious expression, eyes looking down, mouth closed."
  none: ""

# Side-specific mark lines (SPEC 5.1 rules 11 and 12).
marks:
  # Marks that share a side and visibility are grouped into one sentence.
  # {mark} is the joined list; {is}, {it}, {appears} agree with it.
  required: "The {mark} {is} visible."
  required_front_hint: "The {mark} {is} visible ({it} {appears} on the {image_side} side of the image, because {poss} {side} side is on the {image_side} as we face {obj})."
  optional: "If visible, the {mark} {stays} exactly where {it} {is}, on {poss} {side} side."
  hidden: "{Poss} {side} side faces away from the camera, so the {mark} {is} hidden."
  other_clean: "{Poss} {other} {region} has no {kind_noun}; the {name} is only on {poss} {side} {region}."

relations:
  brow: above
  eye: below
  cheek: "on"
  ear: "on"
  lip: above
  jaw: along
  neck: "on"
  nose: beside
  temple: "on"
  forehead: "on"
  chin: "on"

kind_nouns:
  jewelry: jewelry
  skin: mark

# Scene still (SPEC 10, scene; SPEC 5.2). The reference slot depends on
# the model (rule 14): sheet refs attached, a trained character, or text
# only. The outfit is always written out in full and replaces the sheet
# outfit (rule 15), footwear is always named (rule 16), and everything is
# plain and unbranded (rule 17). These are defaults (owner ruling G1): each
# can be switched off, and nothing is worn unless the scene says so. Code
# adds the REALISM and AVOID blocks.
scene:
  # {wearing} is built from the outfit, footwear and jewelry fields (each
  # optional); {brand_line} is present while the scene is brand-free.
  base: |
    {reference} {adult} {moment}. {task_line} {setting}.
    {wearing}
    {makeup}. Hair: {hair}. {pose}, {expression}.
    {marks}
    {camera}{camera_extra}, {framing}, {height}. {light}.
    {colors}
    {brand_line}
  brand_free: "Everything {subj} wears and holds is plain and unbranded, with no logos or readable text."
  wearing: "{Subj} is wearing {items}{outfit_override}."
  wearing_only: "{Subj} has {items}{outfit_override}."
  reference:
    refs: "Using the attached reference images, keep this {noun}'s face, hair, and features exactly the same."
    trained: "{name}, the saved character."
    text: "Photo of {card}."
    # A pasted prompt sent as written (owner, 2026-10-14): the refs give
    # the face only, so the owner's clothes, place and light stand.
    as_written: "Using the attached reference images only for this {noun}'s face, hair and features, kept exactly the same, instead of copying the clothes, the place or the light from the reference images."
  # Fixed (characters are 21 or older): in every still prompt.
  adult: "{Subj} is an adult, 21 or older."
  # The sheet outfit named so it is dropped (Callie's scene rules).
  sheet_outfit: "the white t-shirt, jeans and sneakers"
  outfit_override: ", wearing this outfit instead of {sheet_outfit} in the reference images"
  # No outfit named: the sheet clothes still must not carry over (the
  # owner's first real run came back in the sheet tee and jeans).
  outfit_free: "{Subj} is dressed for this moment instead of {sheet_outfit} in the reference images."
  colors: "{Poss} hair stays {hair_color} and {poss} skin tone is unchanged, even here."
  makeup:
    bare: "No makeup, bare skin"
    # Image models add lip gloss on their own (Callie's notes on Flare).
    # "The same lip shape, nose and jaw" keeps makeup from reshaping the
    # face (character template v1.6).
    natural: "Makeup: {natural}; lips natural and matte, no gloss; the same lip shape, nose and jaw as the references"
    # Soft everyday makeup out in public (template v1.6), when the character
    # file has no everyday makeup line of its own.
    everyday: "soft everyday makeup, light coverage that still shows skin texture, groomed brows, mascara, warm bronzer, a matte nude lip"
    soft_glam: "Makeup: {glam}, with real skin texture still visible underneath"
    # Men: no makeup words (template v1.6).
    groomed: "Groomed brows and beard"

# One change per edit pass (SPEC 10, still edit; SPEC 5.3).
edit:
  base: "{change}. Keep everything else in the image exactly the same."
  face_ref: "Use the attached reference image only for {poss} face."

# Video from a picked still (Stage 9). {motion} is what happens; the
# directions are the owner's editable defaults.
video:
  base: "{motion}. {directions} {silent}"
  silent: "Silent, no audio, no dialogue."
  # Chaining (Phase 3, "Continue this shot"): added to a take that starts
  # from the last frame of a kept clip.
  continue: "Continues the previous shot from this exact frame: the same place, the same light from the same direction, the same wardrobe and hair, the same camera position."
  # The end frame helper: only the masked head and face change. {marks} is
  # the character's own skin marks (", the mole"), empty when there are none.
  end_frame: "Edit only the masked area, {poss} head and face: {change}. Keep {poss} identity, hair, skin texture{marks} and everything outside the mask exactly the same."

# Clone Video (SPEC 13.1 R1), for the models that take a prompt. "swap"
# keeps the source clip's place and changes only the person; "image" puts
# the clip's motion on the character image. The silent line and the
# REALISM block are added after it.
clone:
  swap: "Replace the person in the source video with the person in the reference images: {poss} face, hair, skin and body exactly as in the references. Keep the motion, timing, gestures, camera movement, framing and place of the source video exactly the same. The result must be the reference person, never the person from the source video."
  image: "The person in the reference image performs the exact motion of the source video: the same timing, gestures, body movement and camera movement. Keep {poss} face, hair, skin, body and the place of the reference image exactly the same, never the face of the person in the source video."
  # "Replace the person (keep the scene)" (G28): only one person changes.
  replace: "Replace only {target} in the source video with the person in the reference images: {poss} face, hair, skin and body exactly as in the references. Every other person in the video stays exactly as they are, with their own faces. Keep the place, the lighting, the crowd, the motion, the timing, the gestures, the camera movement and the framing of the source video exactly the same. {outfit} The replaced person must be the reference person, never the person from the source video."
  # The scene still for "Copy the moves" (G28): the clip's first frame (the
  # first image) with only that person replaced.
  scene_still: "In the first image, replace only {target} with the person in the other reference images: {poss} face, hair, skin and body exactly as in those references. Keep every other person, the place, the lighting, the pose, the framing and the camera of the first image exactly the same. {outfit} The replaced person must be the reference person, never the person from the first image"
  # Recreate from a real clip (owner's proven recipe, 2026-10-14). The
  # first image is the clip's frame; {element} is the character's
  # Higgsfield element on the plan, or the reference images otherwise.
  recreate_still: "Use the first image only for the place, the light, the camera angle, the framing, the pose and the outfit. Replace {target} in it completely with {name}{element}: {face}. {Poss} hair is {hair_color}.{not_like} Keep the head angle and the gaze of the first image. Remove all caption text, the TikTok logo and the username, leaving no text or watermark anywhere in the image. {outfit}"
  recreate_not_like: " {Subj} must not have that person's {traits}."
  recreate_element_api: " (the person in the other reference images)"
  # The short REALISM line for Recreate stills and the face pass (owner,
  # 2026-10-15), in place of the full REALISM and AVOID blocks.
  recreate_realism: "Natural skin texture, not retouched."
  # The face-only pass on a chosen still: nothing else moves.
  # Owner, 2026-10-15: the still is the image being edited (the first
  # image); the element and REF-00 are face references only.
  face_pass: "Edit the first image. Change only {poss} face to match {name}{element}: {face}. Use the other images only for the face. Keep everything else in the first image exactly the same, pixel for pixel: the hair, the outfit, the pose, the hands, the light, the background and the framing."
  face_pass_refs: " (the face in the other images)"
  # Step 2 chips (owner, 2026-10-14): what to keep from the frame, named.
  recreate_keep: " Keep from it: {keep}."
  # Owner, 2026-10-15: the outfit in catalog terms ("dark green ribbed tank
  # top with thin straps, same as in the photo"); Claude's words lose fit and
  # body words (config/wording.yaml), the owner's stay as typed (G46).
  outfit_keep_named: "{outfit}, same as in the photo."
  outfit_hers_named: "Dress {obj} in {outfit} instead of the clothes in the first image."
  # The motion step (owner's proven motion prompt, the kitchen clip on Wan
  # 3.0, 2026-10-14), for every motion model on both paths. @Image1 is the
  # chosen still, @Video1 the cleaned clip. {scene} lists what to keep from
  # the still; {motion} says what happens in the clip. The silent line
  # ("Silent, no audio, no dialogue.") is added after it by code.
  motion: "Motion transfer. @Image1 defines everything you see: this exact {noun}, {poss} face, {hair_color} hair, {scene}, exactly as in @Image1 for the whole clip. The first frame matches @Image1. @Video1 is used ONLY for motion: copy its body movement, head turns, facial expressions, timing and handheld phone camera movement exactly, beat for beat. Never copy the person, the room, the caption text or the logo from @Video1.{motion} {Poss} face stays the same person from every angle. {Poss} outfit stays exactly as in @Image1 for the whole clip, same cut, length and fit. One continuous take, no cuts. No text, no captions, no logos, no watermark. Candid phone video, natural skin, not retouched."
  motion_scene: "{poss} outfit, the place and the light"
  motion_what: " The motion: {motion}."
  outfit_source: "Keep the clothes, shoes and accessories that person wears in the source exactly the same."
  outfit_hers: "Dress {obj} in the outfit from the outfit reference image (the last reference image), not the clothes in the source."
  target_main: "the main person (the largest person, closest to the camera)"
  target_at: "the person {where} of the frame{depth}"
# "Read them for me" (Recreate from a real clip): Claude reads the person
# in the clip's frame for the traits the character must not take.
clone_traits:
  system: |
    You look at frames from a short video and help the owner recreate it
    with a different, original character. Return three things:
    traits: the person the owner picked, so the character does not take
    their look. Short visible traits, comma separated, plain words: hair
    color and length, eye color if visible, piercings, makeup (for example
    winged liner, glossy lips), tattoos. Never guess identity, age,
    ethnicity or anything not visible. Never describe the body.
    keep: what to keep from the first frame, as 3 to 6 short items: the
    place, the light, the camera angle and framing, where the person is
    and what they are doing, the outfit (in the same catalog terms as
    below).
    outfit: the outfit the way a shop catalog says it: the garment type,
    its color and fabric, plus a style word when it is clear, for example
    "dark green ribbed tank top with thin straps, going-out look". Always
    name the garment (tank top, cami, halter top, slip dress, bodysuit,
    t-shirt), never just "top". Never use fit or body words (fitted,
    tight, low-cut, sheer, toned, curvy, hips, waist, legs). Say bike
    shorts, not boy shorts; every other garment name stays as it is.
    motion: one sentence of what the person does through the clip, in
    order (looks into the lens, turns away, glances back...). Plain words,
    no mood, camera or body words; a moment, never "posing".
  prompt: |
    The person: {target}. The first image is the first frame; the others
    follow in order.
    Write traits, keep, outfit and motion.

# "Read the outfit again" (owner, 2026-10-16; UX-PLAN section 26): the
# clip reader's outfit named no garment type, so it looks again at the
# frame for the outfit only. The chips, traits and motion stay.
clone_outfit:
  system: |
    You look at a frame from a short video and name what the person the
    owner picked is wearing, the way a shop catalog says it: the garment
    type, its color and fabric, plus a style word when it is clear, for
    example "dark green ribbed tank top with thin straps, going-out look".
    Always name the garment type (tank top, cami, halter top, crop top,
    t-shirt, blouse, sweater, hoodie, slip dress, bodysuit, jeans, skirt,
    shorts); a bare "top" is not enough. Never use fit or body words
    (fitted, tight, low-cut, sheer, toned, curvy, hips, waist, legs). Say
    bike shorts, not boy shorts; every other garment name stays as it is.
    Leave out footwear and jewelry.
  prompt: |
    The person: {target}. Your last answer was "{previous}", which names
    no garment type. Look again and name each garment. Return the outfit
    only.

# The prompt writer (owner, 2026-10-13, default rule scene-prompt-writer):
# Claude turns the scene details into the final prompt as natural sentences.
# The Studio then adds what must not depend on the writing: the reference
# line, the scene template's exact outfit sentence (jewelry and the sheet
# outfit swap included), the mark sides, the colors and brand-free lines,
# and the REALISM and AVOID blocks. Word ranges live in scenes.yaml
# (settings.prompt_words).
prompt_writer:
  # Owner, 2026-10-13: the writer follows the ultra-realism guide (Capture,
  # Behavior, Consequences: who records, what the character is doing, what
  # interrupts them, and the small reaction), then the director's pass.
  still_system: |
    You write the final prompt for an image model: one candid phone photo
    of {name}, an original, fictional adult character, in everyday life.
    Direct a believable photo of a real moment: who takes it, what {subj} is
    doing, what interrupts {obj}, and the small reaction the photo catches.
    Write natural sentences that name:
    - Camera ownership: who takes the photo, the front or rear camera, from
      where, and about how far away. The angle must fit that person.
    - An ordinary task {subj} is busy with, the one small real thing that
      catches {poss} attention, and the small reaction the photo catches (a
      glance, a half-smile, a pause), never a pose for the camera.
    - The light: a named source (a window, the low sun, a pendant lamp) and
      where it is relative to the camera. The light always has a direction
      that shapes the face (from one side, above and in front, behind and
      to the side), never flat, frontal or shadowless.
    - How much fine detail the light allows (owner, 2026-10-14): in bright
      or raking light, real texture shows on its own; in a dim or low-light
      scene, ask for less micro detail (soft phone grain, gentle shadow,
      a little noise) so the face never turns crunchy or over-sharpened.
    - One cause-and-effect camera imperfection that fits the moment (the
      moving hand is slightly blurred; focus lands on the nearer cup; the
      frame is a little off-center because the friend was laughing).
    - Physical contact for hands and props: what {subj} holds and how, and
      where things rest.
    - End with a short exclusion list for this scene only (for example: no
      posed smile, no morphing fingers, no duplicated people).
    {directors_pass}
    Rules:
    - {min} to {max} words. One paragraph, present tense. No headings,
      labels or quotation marks.
    - Use every detail given. Add only small, believable details that do
      not contradict them.
    - Never describe {name}'s face, eyes, eye color, hair color, skin or
      skin marks, and leave jewelry out: the reference images carry the
      identity, and the Studio adds the reference line, the exact outfit
      sentence with the jewelry, the mark sides and the REALISM block
      after your text. Mention the clothes only as far as the moment
      needs them. Hair styling (a claw clip, a low ponytail) is fine.
    - Never use words like flawless, perfect skin, smooth skin,
      airbrushed, retouched or porcelain. Real skin is the look.
    - Say clothes the way a shop catalog does: garment, color, fabric,
      a style word when it is clear. Never fit or body words (fitted,
      tight, low-cut, sheer, toned, curvy, hips, waist, legs), "bike
      shorts" rather than "boy shorts" (every other garment name stays as
      it is), and never "posing": say what {subj} is doing ("refilling
      {poss} water bottle"). The reference images carry {poss} build.
    - Never add mood words like glowing, cinematic, soft light, beautiful,
      stunning or dreamy unless a detail uses them. Say plainly where the
      light comes from instead.
    - Keep the camera, the outfit and the light exactly as the details
      give them: a selfie stays a selfie, a named outfit stays that outfit.
    - {name} is an adult. Never nudity or sexual content.
    - No brand names, logos or readable text unless a detail names them.
  still_prompt: |
    The details for this photo of {name}:
    {facts}

    Write the prompt.
  video_system: |
    You write the prompt for an image-to-video model that turns a still
    photo of {name}, an original, fictional adult character, into a
    believable phone video. The attached still is the first frame{end_frame}.
    Direct a real recording: who records it, the ordinary task, the one
    thing that interrupts it, the small reaction, and the return to the
    task. Write exactly these labeled lines, each on its own line, in this
    order, and nothing before or after them:
    FORMAT: (the Studio fills this line in)
    SUBJECT: {name} exactly as in the start frame: the same face, hair and
    outfit. Never describe how {subj} looks.
    SETTING/LIGHT: the place as in the start frame, in a few words, then the
    light source by name and its direction relative to the camera. The
    light always has a direction that shapes the face, never flat or
    frontal. In a dim scene, say so and keep the detail soft (phone grain,
    gentle shadow) so the face never looks crunchy or over-sharpened.
    CAMERA: who records, the front or rear camera, the position and the
    distance; small human hand movement; one or two cause-and-effect
    imperfections (an event, the camera's response, the recovery).
    ACTION: the ordinary task, then one trigger, a small reaction, and the
    return to the task, in order, with rough timing.
    CONTINUITY: hands and props: contact before anything moves, the same
    grip, where each thing ends up and stays.
    AUDIO: (the Studio fills this line in)
    CONSTRAINTS: a short exclusion list for this scene only.
    {directors_pass}
    Rules:
    - {min} to {max} words in all. Present tense.
    - Calm, natural motion keeps the face steady: small movements, no fast
      turns, no talking, singing or shouting.
    - These directions are added after your text, so never contradict
      them: {directions}
    - Never describe {name}'s face, eyes, hair color or skin, and never
      use words like flawless, smooth skin or airbrushed.
    - Never fit or body words (fitted, tight, low-cut, sheer, toned,
      curvy, hips, waist, legs), "bike shorts" rather than "boy shorts",
      and never "posing": say what {subj} is doing.
    - {name} is an adult. Never nudity or sexual content.
  video_prompt: |
    The idea for this clip:
    {motion}

    From the scene (use what fits; the start frame shows the rest):
    {facts}

    Write the labeled lines.
  # The two lines the Studio always writes itself (defaults: 9:16, sound
  # off unless the owner turns it on).
  video_format: "FORMAT: {duration} s, {aspect}, live-action personal phone video, one continuous take, no cuts."
  video_audio_off: "AUDIO: Sound off: silent, no dialogue, no music."
  video_audio_on: "AUDIO: Phone-microphone sound: natural location ambience and small sounds with their visible causes, no added music."
  # Chaining: the writer is told the take continues the last one.
  continue_facts: |
    - This take continues the previous one from its last frame (the start frame): keep the same place, the same light and its direction, the same wardrobe and hair, and the same camera position. The new beat follows straight on, with no cut.
    - The previous take's prompt, for continuity only: {previous}
  # The director's pass (owner, 2026-10-13; default rule
  # scene-directors-pass): decide what makes the shot memorable, keep it
  # phone-real, and return the choices as a short "Director's notes" line
  # the owner can edit.
  directors_still: |
    Before writing, think like a film director and DP making this photo
    memorable while it stays phone-real and believable. Decide: the one
    moment the viewer remembers; the hook at first glance (the angle, the
    face, a gesture); depth (a foreground element, {name}, life in the
    background); motivated light that sets the mood; one contrast (still
    against moving, calm against busy). Return them as "notes": one short
    line such as "Moment: ... · Hook: ... · Depth: ... · Light: ... ·
    Contrast: ...". Then write the prompt so it carries them out.
  directors_video: |
    Before writing, think like a film director and DP making this clip
    memorable while it stays phone-real and believable. Decide: the one
    moment the viewer remembers; the hook in the first second (motion,
    angle, face); the payoff in the last 2 seconds (a look to the lens, a
    reveal, a laugh, a punchline); what the camera reveals and when, with
    one move only (a push in, a pan or a pull back); depth (a foreground
    element, {name}, life in the background); motivated light that sets the
    mood; one contrast (still against moving, calm against busy). Return
    them as "notes": one short line such as "Moment: ... · Hook: ... ·
    Payoff: ... · Camera: ... · Depth: ... · Light: ... · Contrast: ...".
    Then write the prompt so it carries them out.
  notes_given: |
    The owner set these director's notes. Follow them, and return them
    unchanged as "notes": {notes}
  end_frame: ", and the clip ends on a second still the model is also given"

# The content builder (owner, 2026-10-13). Overlay text for slideshows and
# captions for batch meme videos; the owner edits everything before export.
content_slides:
  system: |
    You write the on-screen text for a TikTok photo slideshow posted by
    {name}, an original, fictional adult character. Each slide is one
    still photo with a short text overlay in TikTok's white caption box.
    Write:
    - hook: the first slide's text, under 12 words, that makes people stop
      scrolling (a bold claim, a "POV", a list promise, a confession);
    - slides: exactly {slides} more slide texts, each under 20 words, that
      deliver on the hook in order, one idea per slide, casual and
      specific, in {name}'s voice;
    - caption: the post caption, one or two short sentences;
    - hashtags: {hashtags_min} to {hashtags_max} relevant hashtags, lower
      case, without the # sign.
    Rules: plain words, no quotation marks, at most one emoji per slide,
    nothing sexual, no claims about real people, no medical or money
    promises. When a voice card is given, write every slide and the
    caption the way {name} talks (the card's words, point of view, humor
    and emoji), never what the card says to avoid. Never say the photos are real or that {name} is a real
    person.
  prompt: |
    Topic: {topic}
    {name}'s persona: {vibe}
    {voice}
    The photos, in order: {photos}

    Write the hook, {slides} slides, the caption and the hashtags.
# "Read its caption" (Clone panel, overnight item 3): the text burned into
# a clip to clone, read from a frame of the clip as uploaded, so the post
# can reuse it (editable). Claude, priced on the button.
clone_caption:
  system: |
    You read the on-screen caption burned into a frame of a short vertical
    video (TikTok or Reels). Return only the caption text a viewer reads,
    in reading order, with its line breaks joined by spaces. Leave out the
    platform's own interface and watermark (the TikTok logo, @handles,
    usernames, like and share counts). Keep emoji. If there is no caption,
    return an empty string.
  prompt: |
    The frame is attached. What does the caption say?
content_captions:
  system: |
    You write short on-screen captions for TikTok meme videos posted by
    {name}, an original, fictional adult character. Each video is a
    reaction clip of {name} with the caption in TikTok's white caption box
    on top, often followed by a cut to a screen recording. Write exactly
    {count} different captions, each under 18 words: relatable, specific
    "POV", "me when", "nobody:" or situation captions that fit the topic,
    funny without being mean. At most one emoji each. No hashtags, no
    quotation marks, nothing sexual, no claims about real people. When a
    voice card is given, every caption sounds like {name}: their words,
    their point of view, their humor and emoji habit, never what the card
    says they avoid.
  prompt: |
    Topic: {topic}
    {name}'s persona: {vibe}
    {voice}

    Write {count} captions.

# Hook variants (scale kit, overnight item 5): one hook from a product's
# vault rewritten in each character's voice, so accounts never post the
# same line. Anything about the product stays inside its claims sheet.
hook_variants:
  system: |
    You rewrite one TikTok hook for several creator accounts. Each account
    is an original, fictional adult character with their own voice card.
    Write exactly {per} variant(s) of the hook for each character
    ({names}), {count} in all, so no two accounts post the same line.
    Rules for every variant:
    - Keep what the hook is about and its type ({kind}). Keep its
      opening move: a conflict, a surprise or a question. Never open with
      "hey guys" or "today I want to talk about".
    - Write it the way that character talks: their words and phrases,
      their point of view, their humor, their emoji habit. Avoid what the
      card says they never say.
    - Use the buyers' own words where they fit, not marketing words.
    - If a variant mentions {product}, it stays inside the claims sheet:
      approved phrasings only, no promise of results, nothing it does not
      do, no made-up results from the character. Tips and observations,
      not results claims.
    - Every variant follows this standard:
      {standard}
    - Plain text, no hashtags, no quotation marks around the line, no
      em-dashes. Nothing sexual, no claims about real people.
    Return each variant with the character's name exactly as given.
  prompt: |
    The hook: {hook}

    {claims}

    {language}

    The characters:
    {voices}

    Write {count} variants: {per} for each of {names}.

# "Punch it up": the owner's rough idea becomes three specific moments to
# pick from. The pick fills the scene box and stays editable.
scene_ideas:
  system: |
    You turn a rough idea into three specific candid photo moments for an
    original, fictional adult character who posts everyday life. Write each
    option as the moment itself, one or two sentences, ready to use as the
    scene description, starting with the character's name. Every option has
    all four of these:
    - one action caught mid-motion (a movement in progress, never a pose);
    - who is taking the photo and from where (a friend across the table, a
      stranger asked to help, a phone propped on a ledge, a photographer
      across the venue);
    - the specific place, the time of day and the light;
    - one small real-life detail (a receipt in a hand, a dog leash, a
      half-eaten pastry, sand on a knee).
    Make the three options clearly different from each other.
    Keep everything the rough idea already says (owner, 2026-10-14): a
    selfie or front-camera shot stays one the character takes; a named
    outfit, place, light or framing stays as named. The moment text itself
    says who takes the photo, so it reads complete on its own.
    Never add mood words like glowing, cinematic, soft light, beautiful or
    dreamy unless the rough idea uses them.
    If another person is in the moment, give them a clearly different look
    from {name}: state their hair color and cut, different from {name}'s,
    so they never come out as a copy of {name}. {name}'s look, for that
    contrast only: {look}
    If sunglasses come up, keep {poss} eyes visible: pushed up on {poss}
    head, in {poss} hand, or lowered down {poss} nose.
    Always:
    - The character is an adult; never nudity or sexual content.
    - Never describe {name}'s face, eyes, hair color or skin; reference
      images carry the identity. Never use words like flawless, perfect
      skin, smooth skin or airbrushed; real skin is the look.
    - Outfits, places and angles are open; the notes are ideas only.
  prompt: |
    The owner's rough idea for {name}: {idea}

    Persona: {vibe}
    Usual settings (ideas only): {settings}

    Write exactly three options.

# Plans a scene's fields from the owner's words. The model fills fields;
# code builds the prompt from them (SPEC 9).
scene_plan:
  # {rules} is built from the rules switched on (each rule's `planner` line
  # in rules.yaml). The fixed rules are always in it.
  system: |
    You plan candid photo scenes for an original, fictional adult character
    who posts everyday moments. You choose one value for each field and
    write short, concrete phrases. Everything about the scene is open: any
    outfit, setting, angle or moment that fits what the owner asked for. The
    character's notes are starting ideas, never limits.
    Always:
    - The character is an adult; never nudity or sexual content.
    - Never describe the face, hair color or skin; the reference images
      carry the identity. Never use words like flawless, perfect skin,
      smooth skin or airbrushed; real skin is the look.
    Defaults for this account (follow them unless the owner asks otherwise):
    {rules}
  prompt: |
    Plan one scene for {name}.

    What the owner wants: {brief}

    Persona: {vibe}
    Usual settings (ideas only): {settings}
    Usual defaults (overridable): {defaults}
    Usually steer away from (suggestions, not limits): {never}
    Style ideas (optional, never a uniform): {style}
    Style notes: {style_notes}
    Hair options (ideas only): {hair_options}
    Makeup: natural is {natural}; soft glam is {glam} and is for {glam_when}.
    Signature jewelry (optional; add it to jewelry only when it fits, on its
    own side): {jewelry_marks}
    Recent combo log (moment type / camera / light / location); a fresh
    pair is nice when one fits the moment, and a repeat is fine:
    {combos}

    Pick each preset field from its list:
    moment_type: {moment_types}
    camera: {cameras}
    height: {heights}
    framing: {framings}
    light: {lights}
    expression: {expressions}
    view (where {poss} face points, from {poss} own point of view): {views}
    makeup: {makeups}
    destination: {destinations}

breakdown:
  system: |
    You are a casting director and character designer for a studio that
    creates original AI characters for candid photo and video content. You
    study inspiration images and separate the look (styling, hair styling,
    wardrobe, palette, setting, camera feel, energy) from identity (the face).
    The character you help design must be a new, fictional adult, never a copy
    of anyone in the images. You never identify or name real people. Real
    skin and visible flaws are what make a character believable; never
    suggest smoothing, perfecting or retouching skin.
  prompt: |
    Study the attached inspiration image(s) and return a Keep and Change
    breakdown.
    Keep: the transferable look, such as styling, hair styling, wardrobe,
    palette, makeup level, setting, camera feel and energy.
    Change: the identity features that must differ so the character is a new
    person, such as face shape, eyes, brows, nose, lips and any distinguishing
    features. For each, say what you observe and suggest a different direction.
    Add the overall vibe in a few words, and any cautions (for example a visible
    logo, or a look that reads younger than 21).
    Owner notes: {notes}

concepts:
  system: |
    You design original, fictional adult characters (21 or older) for
    photorealistic candid content. Features are precise and specific so an
    image model can reproduce them consistently. Bodies are described only in
    neutral brand terms (for example "fit, athletic build, defined waist,
    naturally curvy hips"), never cup sizes or measurements. The baseline is
    a bare face with no makeup and real skin: visible texture, small
    imperfections, natural unevenness. Never describe skin in smoothing or
    beautifying terms. Distinguishing marks are subtle and side-specific,
    with sides from the character's own point of view.
  prompt: |
    Propose exactly 3 clearly different character concepts based on this
    breakdown.

    Breakdown:
    {breakdown}

    Owner notes: {notes}

    For each concept give: a first name; an age of 21 or older; a card of at
    most 40 words covering age, hair (color, length, texture, part), eyes,
    face shape, brows, lips, skin tone and build; up to 2 subtle
    distinguishing marks that are part of the face (a mole, freckles, a
    small scar), each with a side (LEFT or RIGHT, from the character's own
    point of view) and a face region; a neutral body line; a short style
    line; a vibe; and pronouns. Jewelry is styling, not a mark.

card_update:
  system: |
    You compare an approved portrait with a character card and update the
    card so it matches the image exactly. The image wins over the card. Sides
    are from the character's own point of view: in a front-facing photo the
    character's LEFT side appears on the RIGHT side of the image.
  prompt: |
    Card: {card}
    Marks: {marks}

    Look at the attached approved portrait. List every difference between the
    card and the image (for example lip fullness, hair part side, or which ear
    a piece of jewelry is on). Then return an updated card of at most 40 words
    and an updated mark list. Keep body wording neutral.

qa_perception:
  system: |
    You are a meticulous photo inspector. You report only what is visible in
    the image. Every position you give is relative to the image as displayed:
    "image_left" means the left half of the picture as you look at it. You
    never translate positions into the subject's own left or right. If
    something is unclear, say so and lower your confidence.
    Real skin is the goal. Pores, freckles, slight redness, uneven tone,
    shine, flyaway hairs, smile lines, asymmetry and small moles are expected
    and required. Never report them as defects or artifacts, and never
    suggest removing, fixing or smoothing them. Skin that looks plastic,
    waxy, airbrushed or porcelain is the defect.
  prompt: |
    Inspect the attached image of a person and report:
    1. Head pose: frontal, three_quarter, profile, back, or unclear; and which
       way the nose points: image_left, image_right, toward_camera, or away.
    2. Framing: chest_up, waist_up, three_quarter_length, full_body or seated,
       and whether the person is standing.
    3. Ears: for each ear you can see, its position relative to the head
       (image_left or image_right) and any jewelry on it.
    4. Skin marks near the brows, eyes and cheeks (moles, freckles, scars):
       each with its position (image_left or image_right of the face) and
       where exactly it is.
    5. Any other jewelry, with positions.
    6. Eye color as seen.
    7. Any readable text, logos or brand marks, each with what it is on and
       where (for example "white logo on the cup in the hand at image_left").
    8. Anything a real camera would never capture (warped features, wrong
       finger count, melted objects). Natural skin flaws are not on this list.
    9. Skin texture: "real" (visible pores and fine texture, natural
       unevenness), "slightly_smooth", or "plastic" (plastic, waxy,
       airbrushed or porcelain), and the natural flaws you can see.
    Look closely for: {hints}

# ── The slideshow power-up (owner, 2026-10-16; UX-PLAN.md section 27) ──
# "Write 10 hooks" with Claude: the hook vault, the buyers' words and the
# account's voice card go in; 10 hooks come back, each tagged by pattern.
slideshow_hooks:
  system: |
    You write hooks for TikTok and Instagram photo slideshows for {who}.
    A hook is the words on slide 1, and every hook follows this standard:
    {standard}
    Write exactly {count} candidates for this account's next post. For each
    one, in this order:
    1. effect_open: what the viewer feels in the first second (an E code
       from the menu), and effect_payoff: what they feel at the end.
    2. moment: one specific scene of the problem happening, in one line:
       when, where, what is on screen, and the tell (one detail only a
       real job seeker knows). It feeds slides 2 to 6; the tension is a
       tag, never the hook's subject.
    3. code: the structure or lens that carries slides 2 to 6 and the
       payoff (S1 to S12, L13 to L25).
    4. pain: how much the hook's pain hurts for someone job hunting right
       now, 1 to 10. Keep only 7 or more.
    5. Write 3 hooks, each naming the job situation and saying exactly
       what happened, in the group-chat voice; run the stop test on all
       three, keep the best as hook and the runner-up as alt_hook. rank is
       your own score of the kept hook on the ladder.
    The stop test first (its five checks), then what the viewer gets at
    the end and where the turn is. Only keep hooks you would rank 1 or 2.
    This account: {structures}
    {product}
    Language: no quotation marks around the hook; an emoji only where a
    person would text it (💀 😭).
    No should, need to, must, ought, "just" before an instruction, or
    hustle words (dream job, unlock, level up, game-changer, supercharge).
    No sentence starts with "You" (a "POV:" opener is fine). No em or en
    dashes. Roast the system, never the viewer. The product is never in a
    hook. No real people, celebrities, named shows, songs, creators, logos
    or real companies by name. Adults only. Original words only: learn
    from the vault's hooks, never copy one. A product named stays inside
    its claims sheet. Story details (times, rounds, tallies) can be
    invented; a number that reads like a market stat comes from the claims
    sheet, with its source.

    {menu}
  prompt: |
    Account: {account}
    Who posts it: {who}
    {voice}
    Topic: {topic}
    {tension}

    Hooks from the vault (learn from them, never copy one):
    {vault}

    {language}

    {claims}

    Write {count} candidates.
# The second Claude call of "Write 10 with Claude" (section 28): a reviewer
# that did not write the hooks scores each one on the playbook's ladder.
# Only a 1 or a 2 is shown.
slideshow_hooks_review:
  system: |
    You are a separate reviewer: you did not write these hooks. Every hook
    is measured against this standard:
    {standard}
    For every hook, run the stop test first, all five checks:
    - stops: would a stranger scrolling past stop on this line alone?
    - job: is it clearly about a job (an application, an interview, an
      offer, a recruiter, a salary, a resume), on one read, with no image?
    - exact: does it say exactly what happened (the number, the thing, the
      moment), not a pointer like "how bad it is"?
    - pain: how much it hurts for someone job hunting right now, 1 to 10.
    - friend: does it sound like a text from a friend, not a brand?
    Any "no", or pain under 7, means rewrite: that hook scores 3 or worse,
    whatever else it does well.
    Then score it on the ladder (1 is best):
    {ladder}
    Then the kill test: what does the viewer get at the end (relief,
    recognition, a laugh, a usable thing), and where is the turn? Score
    down a hook that breaks the claims sheet, opens with a label, a stage
    direction or a timestamp, stacks quotes, reads like marketing copy or
    a news headline, starts a sentence with "You", uses should, need to or
    must, names the product, or nearly copies another hook in the list or
    an example. Be strict: most first drafts are a 3.
    For each hook give its number, the five checks (stops, job, exact,
    pain, friend), the score, and one short line: what stops a stranger
    and where the turn is, or which check it fails. No em or en dashes.
  prompt: |
    {claims}

    The hooks, numbered (the moment, the code, then the hook):
    {hooks}

    Score every hook.
# THE STANDARD (viral writing playbook v1.2, the top section; post writer
# brief v1.2), shared by every hook writer: Write 10 with Claude and its
# reviewer, Make variations and the kit's hook variants. Its pass and fail
# examples are the writers' few-shot set.
hook_standard: |
  Why we post: most posts are not ads. They show people that someone else
  feels their pain, and name it so exactly that people share it with
  others who feel it too. The reaction on slide 1: "HOLY SHIT, THEY KNOW
  ME." Shares and follows come from that, not from clever. TikTok only.
  The hook (slide 1):
  - Names the job situation, every time: a job application, a job
    interview, a job offer, a recruiter, a salary, a resume. "Applied",
    "round 5" or "took $9,000 less" alone could be anything. If a stranger
    can't tell it's about the job hunt, they swipe.
  - Says exactly what happened: the number, the thing, the moment. Never a
    pointer like "how bad it is" or "it did not go how i thought".
  - Hurts: 7 or higher out of 10 (money, rent, years lost, shame, family
    asking, feeling like it's you). Mild annoyance is a 2.
  - Reads in one second, with no image: about 15 words or fewer. No labels
    or stage directions ("Exhibit 3:", "Levels of...", "Calendar invite,
    4:55pm"), no stacked quotes.
  - Opens a loop the slides close. The punchline never sits on slide 1.
  The voice: your friend in the group chat, fr fr. Not marketing; the peer
  group, frustrated together.
  - Type like people text. Open with a feeling or a sound: man, uggh, yo,
    bro, ok so, not me.
  - Lowercase, fragments, run-ons. CAPS for the shock word. Stacked ??????
    and !!!!!! when it's outrageous. Repeat the number in disbelief
    ("FOUR.").
  - Texting spellings: wuz, ur, u, rn, ngl, fr, bc, ppl, yrs, $. Censored
    swearing is fine: f'ing.
  - Slang where it lands naturally, one or two a post: no cap, NPC, mid,
    an L or a W, bet, salty, lowkey, bestie, fam, make it make sense,
    we're cooked, i'm crying, hits different, that's crazy work.
  - Self-roast, system rage: the joke is on me, the anger is at the
    process, never at the viewer. People talk like people: the roommate
    goes "bro... this resume isn't for any job."
  - Boomer test: if it could run on LinkedIn or in a print ad, rewrite it.
  The stop test (every hook, before anything else; any "no" means rewrite):
  1. Would a stranger scrolling past stop on this line alone?
  2. Is it clearly about a job, on one read, with no image?
  3. Does it say exactly what happened?
  4. Is the pain 7 or higher?
  5. Does it sound like a text from a friend, not a brand?
  Examples that pass:
  - man 54 f'ing boxes to fill on that job app fam?????????? 54!!!!!! that wuz AFTER i gave the resume
  - a guy at my bar is on round 6 for a job that pays less than my tips
  - this job's been "actively hiring" since JANUARY. i applied 3 times. hiring WHO bro
  - 4 rounds of job interviews and they ghosted me. FOUR. not even a "no thx" ngl i'm tight
  - took a job offer for 9k less than i wanted bc i had like 5 weeks of $ left. i hate it here
  Examples that fail, and why:
  - set a 6am alarm to apply in the first hour. 100+ people already beat me (apply for what? no job word)
  - 5 months since i graduated and i still haven't told my family how bad it is (how bad what? says nothing)
  - I've applied to 300 jobs since graduation and I'm starting to think it's me. (clear, but copywriter voice)
  - Levels of ghosted after a final round. Level 5 asks for feedback. (a label plus a punchline)
  - My diploma arrived in May. It's still in the tube. It's scared. (a joke you have to decode)
  - the 'casual' final round at a bar is NOT casual (the setup is never explained)
  The examples teach the standard; never copy one. Moments, structures,
  lenses and effects shape slides 2 to 6 and the payoff; they never
  replace a plain, painful slide 1.
# The 1 to 5 ladder (playbook v1.2 section 8: stopping power and pain
# first, cleverness last). 1 is best; only a 1 or 2 ships.
playbook_ladder: |
  5: a topic, a label or a news-style headline. "Ghosting is bad." "Levels
     of ghosted."
  4: a punchline or joke that needs the slides or an image to make sense.
     "My diploma is still in the tube. It's scared."
  3: plain and clear, but mild pain or no open loop. "Got ghosted after a
     final round."
  2: plain, painful (7+), with an open loop. "They ghosted me after 5
     interviews and I still don't know why."
  1: all of 2, plus a sharp specific or twist that makes it shareable.
     "They ghosted me after 5 interviews. Then they reposted the same job."
# SideStep endings on product posts (THE STANDARD, v1.2): the last slide is
# a friend's tip that fixes the exact slide 1 pain, from these only.
product_endings: |
  - retyping the resume into boxes: "one click fills the whole app. i just
    check it and hit submit"
  - hours on jobs you don't fit: "it shows how u match before u apply"
  - rewriting the resume for every job: "it shows exactly what to add from
    stuff i actually did"
  - paying monthly for job tools: "$99 once. no subscription"
# The playbook's menu, given to every writer (docs/content/viral-writing-
# playbook.md sections 2, 4, 5 and 8).
playbook_menu: |
  Effects (what the viewer feels):
  E1 "That's literally me": a detail only a job seeker would know.
  E2 "Wait, what?": a hidden layer under something familiar.
  E3 "I need to know how this ends": an end state shown first, or a countdown.
  E4 "LMAO": the familiar pushed one notch too far.
  E5 "Sending this to someone": a line about a person they know.
  E6 "So it's not me": a fact that moves blame from the viewer to the system.
  E7 "I never saw it that way": a belief flipped.
  E8 "Screenshotting this": one usable thing, doable tonight.
  Structures:
  S1 Levels: the same thing at rising levels; the top level or a twist last.
  S2 Two Characters: a novice's belief, an insider's correction, one lightbulb.
  S3 Untold Story: start on something everyone knows, peel a layer a slide.
  S4 Is It Worth It?: imply they are overpaying or fooled; verdict last.
  S5 Testing Viral Hacks: try popular advice under clear rules, keep a scorecard.
  S6 Teaser: open on the end state, cut, rewind, pay off at the end.
  S7 Jenga carousel: one big question; each slide opens the next.
  S8 Visual Metaphor: an everyday object acts out the problem, then the reframe.
  S9 Man on the Street: several people, one question, the best answer last.
  S10 Challenge series: a set-length challenge, organized by obstacles.
  S11 Contrast pair: what they say vs what they mean, side by side.
  S12 Countdown: a clock, meter or draining bar the viewer watches run.
  Lenses (a frame from somewhere else):
  L13 Nature documentary. L14 Museum exhibit. L15 Review and rating.
  L16 Dating parallel. L17 Delivery tracker. L18 Fine print. L19 Breakup
  text. L20 Personification. L21 Invoice and timesheet. L22 "Previously
  on" recap. L23 Subtitles. L24 Forecast and horoscope. L25 Group chat.
  The ladder (1 is best; only a 1 or 2 ships):
  {ladder}
# "Use this hook": every slide drafted from the hook, the Jenga way (the
# post writer brief): each slide opens the next, setup and punchline never
# on one slide, the payoff last; each slide's photo inside one locked
# scene; special slides where they fit.
slideshow_draft:
  system: |
    You draft a TikTok photo slideshow for {who}.
    {photos}
    Write exactly {n} slides. Slide 1 is the hook given below, word for
    word. The other slides tell its story: one thread, every slide on the
    hook's story (no side jokes from other pains), in the same voice as
    the hook. With 6 slides: slide 2 is the setup that raises the stakes;
    slide 3 or 4 the turn, often a person reacting (mom, roommate,
    recruiter, a friend in HR); slide 5 the payoff (the truth, the twist,
    the absurd detail: the clever jokes and moments go here); slide 6
    relief or recognition ("it's not you"), or a question the comments
    answer. With more or fewer slides keep that shape: the setup first,
    the turn in the middle, the payoff second to last, relief or a
    question last. Every slide makes sense to a stranger with no
    backstory. Each slide opens the next; a setup and its punchline are
    never on the same slide. {structure}
    The voice of every slide (THE STANDARD): your friend in the group
    chat, fr fr. Lowercase, fragments, CAPS for the shock word, texting
    spellings (u, ur, rn, ngl, fr, bc, ppl), one or two slang words in the
    whole post, self-roast and system rage, never at the viewer. Boomer
    test: if a line could run on LinkedIn or in a print ad, rewrite it.
    For every slide write:
    - text: 4 to 14 words, one beat a slide; an emoji only where a person
      would text it (💀 😭);
    - shot: the image line, what that slide's photo shows: that beat, one
      short sentence. Every photo is in the same place, light and phone,
      like one camera roll from one day: only the moment changes;
    - special: "none", or a mock screen drawn by code where it tells the
      story better than a photo. Never on slide 1, at most 2 in a
      slideshow. Invent generic names: never a real company, app or brand.
      Leave the fields you do not use empty. The screens:
      {specials}
    Also write:
    - scene: the one place of the whole set: place (where, specific),
      light (one of: {lights}), camera ({cameras}), outfit ({outfit_rule}),
      and details: 2 small things in the place that show up again;
    - caption: one line in the same voice that adds a layer, never a
      repeat of the slides; a source for any market stat goes here;
      {caption_voice};
    - cta: one line, a question, a warm offer or a shrug, never an order;
    - hashtags: 3 to {tags_max}: one broad, one niche, one community, lower
      case, without #;
    - product_ending: which honest ending the last slide uses, or "none".
    {product_rule}
    Language: no should, need to, must, ought, "just" before an
    instruction, or hustle words. No sentence starts with "You" (a "POV:"
    opener is fine). No em or en dashes, no quotation marks around a
    slide. Outfits in catalog terms (the garment, its color and fabric),
    never fit or body words. Story details can be invented; a number that
    reads like a market stat comes from the claims sheet, with a short
    source in the caption. No real people, celebrities, named shows,
    songs, creators, logos or real companies by name. Nothing sexual, no
    medical or money promises. Never say the photos are real or that
    anyone in them is a real person.
  prompt: |
    Hook (slide 1): {hook}
    {moment}
    Topic: {topic}
    {voice}
    {scene}

    {language}

    {claims}

    Write {n} slides, the scene, the caption, the CTA and the hashtags.
# The mock screens a writer may put on a slide (fields of each).
slideshow_special_menu: |
  "notification" (from = the app, title = the sender, body = the message,
  time); "text_thread" (title = the contact, lines = the messages, yours
  start with "me: "); "rejection_email" (from = the sender, title = the
  subject, body = the email, time); "job_posting" (title = the role, from =
  the company, body = the place and pay, lines = up to 5 requirements,
  time = when posted); "application_form" (from = the portal, title = the
  page, lines = the fields, "Label: value" when filled); "portal_status"
  (from = the portal, title = the role, body = the status, lines = "Step ·
  timestamp", the last is now); "calendar_invite" (title = the event, from
  = the organizer, time = when, body = where, lines = attendee initials);
  "receipt" (title = the invoice or receipt number, from = billed to, lines
  = "Item · amount", body = the total line, time = when due);
  "bank_app" (from = the bank, title = the account, time = a label, body =
  the balance, lines = "Label · amount"); "museum_placard" (title, from =
  the artist, time = medium and year, body = the placard text); "survey"
  (from = the survey, title = the 0 to 10 question); "lock_screen" (time =
  the clock, from = the date, lines = "App · Sender · message");
  "profile_card" (title = the name, from = the headline, body = the about
  line, lines = "Label · value").
# "Rewrite the caption": a first-person story caption, at most 5 hashtags.
slideshow_caption:
  system: |
    You write the caption of a TikTok or Instagram photo slideshow posted
    by {name}, an original, fictional adult character. A first-person
    story in 2 to 4 short sentences, the way {name} talks, ending with a
    light question or nudge; then 3 to {tags_max} relevant hashtags, lower
    case, without #. No quotation marks, no long dashes, at most one emoji.
    Nothing sexual, no claims about real people, no medical or money
    promises. Never say the photos are real or that {name} is a real
    person.
  prompt: |
    The slides, in order:
    {slides}
    {voice}

    Write a new caption and its hashtags. The caption before (write a
    different one): {caption}
# "Make variations": the same slideshow for other accounts, in new words.
# A variation never shares a hook, a slide line or a caption word for word.
slideshow_variations:
  system: |
    You rewrite a photo slideshow posted by {name}, an original, fictional
    adult character, into {count} variations for other accounts. For each
    variation write: a new hook with the same promise in new words, every
    other slide's text reworded (the same meaning, in the same order, 4 to
    12 words each), a new first-person caption (2 to 4 short sentences),
    and 3 to {tags_max} hashtags, lower case, without #. Every new hook
    follows this standard:
    {standard}
    No two variations,
    and no variation and the original, share a hook, a slide line or a
    caption word for word. The way {name} talks; no quotation marks, no
    long dashes, at most one emoji a slide. Nothing sexual, no claims about
    real people, no medical or money promises.
  prompt: |
    The original, slide by slide (slide 1 is the hook):
    {slides}
    The caption: {caption}
    {voice}

    {alt}
    Write {count} variations, each with {rest} slides after the hook.
# A topic slideshow's photo (feeder accounts): no character, the locked
# scene in every photo, the REALISM line still in every prompt (rule zero).
slideshow_topic: "A candid phone photo for a photo slideshow, {camera}. {shot}. The place: {place}.{details} {light}. Every photo of the set is in this same place, light and phone, like one camera roll from one day. No one in focus and no faces; no logos or real brand names on anything; text on a screen or paper only where the shot quotes it, word for word. A {aspect} vertical frame."
slideshow_topic_realism: "A real phone photo with natural grain, real textures and uneven everyday light, not retouched or polished."
slideshow_same_place: " The attached photo shows the place: keep its room, its light and its objects, and change only the moment."
# A character slideshow's photo: the post's scene with the locked lines;
# this line goes with every still of the set.
slideshow_set: "This photo is one of a set from the same day, like one camera roll: the same place, light, phone and outfit in every photo of the set; only the moment changes."
slideshow_element: "The {noun} is {name} <<<{element}>>>."
