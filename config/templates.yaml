# Prompt templates (SPEC 10). {braces} are filled by the engine from the
# character record; LLMs never write these prompts from scratch.
# Pronoun placeholders: {subj} she, {obj} her, {poss} her, {noun} woman.
version: 1

hero:
  # Text only: never attach the inspiration image (SPEC 5.1 rule 1).
  base: |
    Chest-up portrait of {card}. {variant} Plain light gray background, soft
    even daylight, simple white crew-neck t-shirt, hair in its usual style.
    {marks}
    Photorealistic, natural skin texture with visible pores, no retouching,
    no makeup beyond everyday.
  variants:
    - "Facing the camera, relaxed neutral expression."
    - "Facing the camera, a small relaxed closed-mouth smile."
    - "Facing the camera, calm attentive expression, chin level, eyes on the lens."

sheet:
  base: |
    Using the attached reference images, keep this {noun}'s face, hair, skin
    tone, and distinguishing marks exactly the same. {framing}. {view}.
    {marks}
    {expression}{body} Plain light gray background, soft even daylight,
    {outfit}. Photorealistic, natural skin texture with visible pores, same
    natural makeup as the reference, no retouching. Same person as the
    reference, not a lookalike.

framing:
  chest_up: "Chest-up framing, from mid-chest to just above the top of the head"
  full_body: "Full-body framing, standing, the whole body visible from head to toe with a little space above and below"

outfit:
  chest_up: "wearing a simple white crew-neck t-shirt"
  full_body: "wearing a simple white crew-neck t-shirt tucked into high-rise blue jeans and plain white sneakers"

# Full-body shots only (SPEC 5.1 rules 9 and 10).
body_line: " Build: {body}. The tee is tucked in so the waist reads."

expressions:
  neutral: "Relaxed neutral expression, mouth closed."
  open_smile: "Natural open smile showing teeth, eyes slightly crinkled."
  laughing: "Laughing naturally, eyes crinkled, head tipped slightly back."
  serious_down: "Serious expression, eyes looking down, mouth closed."
  none: ""

# Side-specific mark lines (SPEC 5.1 rules 11 and 12).
marks:
  # Marks that share a side and visibility are grouped into one sentence.
  # {mark} is the joined list; {is}, {it}, {appears} agree with it.
  required: "The {mark} {is} visible."
  required_front_hint: "The {mark} {is} visible ({it} {appears} on the {image_side} side of the image, because {poss} {side} side is on the {image_side} as we face {obj})."
  optional: "If visible, the {mark} {stays} exactly where {it} {is}, on {poss} {side} side."
  hidden: "{Poss} {side} side faces away from the camera, so the {mark} {is} hidden."
  other_clean: "{Poss} {other} {region} has no {kind_noun}; the {name} is only on {poss} {side} {region}."

relations:
  brow: above
  eye: below
  cheek: "on"
  ear: "on"
  lip: above
  jaw: along
  neck: "on"
  nose: beside
  temple: "on"
  forehead: "on"
  chin: "on"

kind_nouns:
  jewelry: jewelry
  skin: mark

breakdown:
  system: |
    You are a casting director and character designer for a studio that
    creates original AI characters for candid photo and video content. You
    study inspiration images and separate the look (styling, hair styling,
    wardrobe, palette, setting, camera feel, energy) from identity (the face).
    The character you help design must be a new, fictional adult, never a copy
    of anyone in the images. You never identify or name real people.
  prompt: |
    Study the attached inspiration image(s) and return a Keep and Change
    breakdown.
    Keep: the transferable look, such as styling, hair styling, wardrobe,
    palette, makeup level, setting, camera feel and energy.
    Change: the identity features that must differ so the character is a new
    person, such as face shape, eyes, brows, nose, lips and any distinguishing
    features. For each, say what you observe and suggest a different direction.
    Add the overall vibe in a few words, and any cautions (for example a visible
    logo, or a look that reads younger than 21).
    Owner notes: {notes}

concepts:
  system: |
    You design original, fictional adult characters (21 or older) for
    photorealistic candid content. Features are precise and specific so an
    image model can reproduce them consistently. Bodies are described only in
    neutral brand terms (for example "fit, athletic build, defined waist,
    naturally curvy hips"), never cup sizes or measurements. The makeup
    baseline is natural and everyday. Distinguishing marks are subtle and
    side-specific, with sides from the character's own point of view.
  prompt: |
    Propose exactly 3 clearly different character concepts based on this
    breakdown.

    Breakdown:
    {breakdown}

    Owner notes: {notes}

    For each concept give: a first name; an age of 21 or older; a card of at
    most 40 words covering age, hair (color, length, texture, part), eyes,
    face shape, brows, lips, skin tone and build; exactly 2 subtle
    distinguishing marks, each with a side (LEFT or RIGHT, from the
    character's own point of view), a face region and whether it is skin or
    jewelry; a neutral body line; a short style line; a vibe; and pronouns.

card_update:
  system: |
    You compare an approved portrait with a character card and update the
    card so it matches the image exactly. The image wins over the card. Sides
    are from the character's own point of view: in a front-facing photo the
    character's LEFT side appears on the RIGHT side of the image.
  prompt: |
    Card: {card}
    Marks: {marks}

    Look at the attached approved portrait. List every difference between the
    card and the image (for example lip fullness, hair part side, or which ear
    a piece of jewelry is on). Then return an updated card of at most 40 words
    and an updated mark list. Keep body wording neutral.

qa_perception:
  system: |
    You are a meticulous photo inspector. You report only what is visible in
    the image. Every position you give is relative to the image as displayed:
    "image_left" means the left half of the picture as you look at it. You
    never translate positions into the subject's own left or right. If
    something is unclear, say so and lower your confidence.
  prompt: |
    Inspect the attached image of a person and report:
    1. Head pose: frontal, three_quarter, profile, back, or unclear; and which
       way the nose points: image_left, image_right, toward_camera, or away.
    2. Framing: chest_up, waist_up, three_quarter_length, full_body or seated,
       and whether the person is standing.
    3. Ears: for each ear you can see, its position relative to the head
       (image_left or image_right) and any jewelry on it.
    4. Skin marks near the brows, eyes and cheeks (moles, freckles, scars):
       each with its position (image_left or image_right of the face) and
       where exactly it is.
    5. Any other jewelry, with positions.
    6. Eye color as seen.
    7. Any readable text, logos or brand marks.
    8. Anything a real camera would never capture (warped features, wrong
       finger count, melted objects).
    Look closely for: {hints}
