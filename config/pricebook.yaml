  - { provider: higgsfield, model: nano-banana-2.1, unit: image, price: 0.15, verified: false, credits: 1.5, credits_verified: true, when: { resolution: 1k }, source: "1.5 plan credits at 1k, Higgsfield's live price in the model test (2026-10-13)." }
