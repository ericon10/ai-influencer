# Price book: the source of every estimate. Prices change often; re-check
# list prices monthly (SPEC 7.2). `verified: false` marks a placeholder that
# has not been confirmed against the provider's published price; it is set
# high on purpose so budget caps err on the safe side. Accounts can override
# entries (negotiated or deposit-discounted prices) in Settings.
version: "2026-10-12"
currency: USD
entries:
  # Higgsfield. USD prices marked `verified: false` are placeholders, set
  # high on purpose, until the pay-per-use API price list is confirmed.
  # `credits` are as charged in the Higgsfield web/MCP account (verified live
  # 2026-10-12) and are shown for reference only.
  # `credits` on the still models answer an account-path estimate only when
  # Higgsfield is too slow to price live and no recent live price is saved.
  # They are set high on purpose and always shown as not confirmed.
  - { provider: higgsfield, model: gpt-image-2.5, unit: image, price: 0.25, verified: false, credits: 6, source: "Placeholder credits." }
