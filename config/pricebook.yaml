# Price book: the source of every estimate. Prices change often; re-check
# list prices monthly (SPEC 7.2). `verified: false` marks a placeholder that
# has not been confirmed against the provider's published price; it is set
# high on purpose so budget caps err on the safe side. Accounts can override
# entries (negotiated or deposit-discounted prices) in Settings.
version: "2026-10-22"
currency: USD
# What one Higgsfield credit costs on the API: 1.5 credits = $0.094, the
# API's published rate, the same rate every Higgsfield dollar price here is
# read at. The daily spend cap (UX-PLAN.md section 31) counts plan credits
# at it, so one cap covers the plan and the API.
api_credit_usd: 0.0625
entries:
  # Higgsfield. USD prices marked `verified: false` are placeholders, set
  # high on purpose, until the pay-per-use API price list is confirmed.
  # `credits` are as charged in the Higgsfield web/MCP account (verified live
  # 2026-10-12) and are shown for reference only.
  # `credits` on the still models answer an account-path estimate only when
  # Higgsfield is too slow to price live and no recent live price is saved.
  # They are set high on purpose and always shown as not confirmed.
  - { provider: higgsfield, model: gpt-image-2.5, unit: image, price: 0.10, verified: false, credits: 3, when: { quality: medium }, source: "Placeholder for Standard (medium, 1k). Not confirmed." }
  - { provider: higgsfield, model: gpt-image-2.5, unit: image, price: 0.25, verified: false, credits: 6, source: "Placeholder credits." }
  # Flare, real charges (owner's runs, read from the account's Higgsfield
  # transactions and generation history, 2026-10-14): Standard (medium) at
  # 2k is 1 plan credit a still, High at 2k is 2.75. The API bills in
  # credits too (its estimate endpoint returns credits and dollars); the
  # dollar side is the credits at the API's published rate (1.5 credits =
  # $0.094) until the first API run logs Higgsfield's own price.
  - { provider: higgsfield, model: gpt-image-2.5-flare, unit: image, price: 0.0625, verified: false, credits: 1, credits_verified: true, when: { quality: medium }, source: "1 plan credit a still at medium, 2k: every Flare spend at medium in the account's transactions (2026-10-13 and 14). Dollars at the API's rate, not yet confirmed by an API run." }
  - { provider: higgsfield, model: gpt-image-2.5-flare, unit: image, price: 0.172, verified: false, credits: 2.75, credits_verified: true, when: { quality: high }, source: "2.75 plan credits a still at high, 2k: the Flare and Sunburst spends at high in the account's transactions (2026-10-13). Dollars at the API's rate, not yet confirmed by an API run." }
  - { provider: higgsfield, model: gpt-image-2.5-flare, unit: image, price: 0.172, verified: false, credits: 2.75, source: "Other qualities priced as High until a run shows the charge." }
  - { provider: higgsfield, model: nano-banana-2.1, unit: image, price: 0.15, verified: false, credits: 1.5, credits_verified: true, when: { resolution: 1k }, source: "1.5 plan credits per image at 1k: Higgsfield's live price in the model test (2026-10-13) and every Nano Banana 2.1 spend in the account's transactions on 2026-10-14." }
  - { provider: higgsfield, model: nano-banana-2.1, unit: image, price: 0.15, verified: false, credits: 2, credits_verified: true, when: { resolution: 2k }, source: "2 plan credits per image at 2k: the Studio's Nano Banana 2.1 runs at 2k in the account's transactions (2026-10-13)." }
