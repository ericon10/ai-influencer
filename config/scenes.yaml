# Scenes and still edits (SPEC 5.2 and 5.3; Stages 7 and 8). Every choice in
# the scene builder is a preset here, written in plain words; the scene
# template (templates.yaml) is filled from these and the character record.
# Labels for moments and cameras are what the combo log records, so they
# match the entries in a character file ("Caught you / Friend shot").
version: 1
# Pronoun placeholders: {subj} she, {obj} her, {poss} her, {noun} woman.

settings:
  # Edits, crops and the face fixes keep the higher setting.
  quality: high
  resolution: 2k
  # Scene stills (owner, 2026-10-14): Standard by default, High one click
  # away on the Generate card. Each level maps to the model's own settings.
  # A model can set its own value for a level: Flare's Standard is medium
  # at 2k (1 plan credit a still, the owner's runs), Nano Banana 2.1's is 1k.
  still_level: standard
  still_levels:
    standard: { label: Standard, quality: medium, resolution: 1k, models: { higgsfield/gpt-image-2.5-flare: { resolution: 2k } } }
    high: { label: High, quality: high, resolution: 2k }
  # The model a new run starts with (owner, 2026-10-14): GPT Image 2.5
  # Flare. Nano Banana 2.1 stays one click away in the model setting.
  default_still_model: higgsfield/gpt-image-2.5-flare
  # Stills per model a new run starts with.
  default_variations: 4
  # A body ref (REF-06 to REF-08) is attached only at these framings: a
  # full-body sheet shot drags the sheet outfit into a closer shot (the
  # owner's first real run, 2026-10-14). Chest-up and waist-up get face
  # refs only.
  body_ref_framings: [knees_up, full_body]
  # SPEC 5.2 rule 21: no repeat of a moment type and camera combo from the
  # character's last N entries.
  combo_window: 10
  # Hair styling rotation: no styling from the last 5 combo log entries or
  # scenes (character template v1.6).
  hair_window: 5
  # SPEC 5.2 rule 14: 2 to 4 sheet refs, always one chest-up face ref.
  max_refs: 4
  # Stills per model in one run, and how many models a run may compare.
  max_variations: 4
  max_models: 2
  # Models offered for scene stills (a character's preferred models come
  # first), for one-change edits, and for crops brought up to full size.
  still_models: [higgsfield/nano-banana-2.1, higgsfield/gpt-image-2.5-flare, higgsfield/soul-2]
  edit_models: [higgsfield/nano-banana-2.1, higgsfield/gpt-image-2.5-flare]
  upscale_model: higgsfield/bytedance-upscale
  # Pre-filled in every new scene (defaults, not locks): the owner or the
  # planner changes them. With these, only the moment itself is required,
  # and the owner's own words count as the moment until it is planned.
  defaults: { momentType: caught_mid_action, camera: friend_phone, light: natural }
  # The prompt writer's length, in words, for the text it writes (the
  # Studio's added lines and the REALISM block come on top).
  # The video prompt is labeled lines (FORMAT to CONSTRAINTS), so it is longer.
  prompt_words: { still: [120, 170], video: [110, 180] }

# Moment types (the first column of the combo log).
moments:
  - { id: caught_mid_action, label: "Caught mid-action" }
  - { id: caught_you, label: "Caught you", hint: "Notices the camera and looks into the lens" }
  - { id: candid_laugh, label: "Candid laugh" }
  - { id: quiet_moment, label: "Quiet moment" }
  - { id: everyday_task, label: "Everyday task", hint: "Cooking, shopping, packing a bag" }
  - { id: walking, label: "Walking" }
  - { id: pov, label: "POV", hint: "Seen through a companion's eyes" }
  - { id: in_the_water, label: "In the water" }
  - { id: mirror_selfie, label: "Mirror selfie" }
  - { id: selfie, label: "Selfie" }

# Who shoots and how (SPEC 5.2 rule 18). Starting points, never limits: the
# planner picks what fits the moment and every field stays editable.
cameras:
  - id: friend_phone
    label: Friend shot
    text: "Candid phone photo taken by a friend about 6 feet away"
  - id: friend_rocks
    label: Friend shot from rocks
    text: "Candid phone photo taken by a friend from a nearby rock or ledge, a little above {obj}"
  - id: over_shoulder
    label: Over-the-shoulder
    text: "Candid phone photo over a friend's shoulder, the shoulder soft and out of focus in the foreground"
  - id: event_long_lens
    label: Event photographer, long lens
    text: "Candid event photo, long lens from across the venue, about 25 feet away, compressed background, blurred foreground ({foreground})"
    foreground: "a door frame and the shoulder of someone at the next table"
  - id: phone_from_inside
    label: Phone from inside
    text: "Phone photo taken from inside the venue looking out, through the open doors"
  - id: pov
    label: POV
    text: "Point-of-view phone photo from a companion's eye level, about 4 feet away"
  - id: selfie
    label: Selfie
    text: "Selfie at arm's length, the phone itself out of frame"
  - id: mirror_selfie
    label: Mirror selfie
    text: "Mirror selfie, a plain unbranded phone held at chest height"
  - id: timer
    label: Phone on a timer
    text: "Phone propped on a ledge with a timer, about 8 feet away"

# Camera height. Any height is allowed; a low angle looking up at the body
# shows a warning while the default rule scene-everyday-angles is on.
heights:
  - { id: eye_level, label: "Eye level", text: "eye level" }
  - { id: slightly_high, label: "Slightly high", text: "from slightly above eye level" }
  - { id: high, label: "High, looking down", text: "from a high angle looking down" }
  - { id: low, label: "Low angle", text: "from a low angle" }

# `skin` is how much skin detail the REALISM block names at this framing
# (owner, 2026-10-13, from the ultra-realism guide): full (pores, peach fuzz,
# stray hairs) close and chest-up, "natural skin texture" waist-up, none
# full-body and wide. "No beauty smoothing, no retouching" always stays.
# Sheet shots use the same ids.
framings:
  - { id: chest_up, label: "Close, chest-up", text: "chest-up framing", skin: full }
  - { id: waist_up, label: "Waist-up", text: "waist-up framing", skin: natural }
  - { id: knees_up, label: "Knees up", text: "framed from the knees up", skin: natural }
  - { id: full_body, label: "Full body", text: "full-body framing with a little space around {obj}", skin: none }
  - { id: wide_small, label: "Wide, small in frame", text: "wide shot, {subj} is small in the frame", identity: skip, skin: none }

lights:
  # The owner's own words describe the light: no light line is added.
  - { id: as_written, label: "From your words", text: "" }
  - { id: natural, label: "Natural light", text: "Natural available light that fits the place and the time of day" }
  - { id: golden_hour, label: "Golden hour", text: "Warm golden-hour sun low in the sky, soft long shadows" }
  - { id: morning, label: "Morning light", text: "Clean, soft morning daylight" }
  - { id: overcast, label: "Overcast daylight", text: "Soft, even overcast daylight" }
  - { id: midday_sun, label: "Midday sun", text: "Bright midday sun with crisp shadows" }
  - { id: window, label: "Window light", text: "Soft daylight from a nearby window, the rest of the room a little darker" }
  - { id: blue_hour, label: "Blue hour", text: "Cool blue-hour sky with warm lights coming on" }
  - { id: night_practical, label: "Night, warm lights", text: "Evening, lit by warm practical lights such as string lights and lamps, slight phone-camera grain" }

# Facial expression; it also picks a matching sheet ref (REF-09 to REF-11).
expressions:
  - { id: neutral, label: "Relaxed", text: "relaxed, natural expression" }
  - { id: soft_smile, label: "Soft smile", text: "soft, closed-mouth smile", ref_expression: open_smile }
  - { id: open_smile, label: "Open smile", text: "natural open smile", ref_expression: open_smile }
  - { id: laughing, label: "Laughing", text: "laughing naturally, eyes crinkled", ref_expression: laughing }
  - { id: focused_down, label: "Looking down, focused", text: "calm and focused, eyes looking down", ref_expression: serious_down }
  - { id: knowing_look, label: "Knowing look at the lens", text: "looking into the lens with a soft, knowing half-smile, mouth closed" }

makeup:
  - { id: natural, label: "Soft everyday", hint: "Out in public" }
  - { id: soft_glam, label: "Soft glam", hint: "Nights out and events" }
  - { id: bare, label: "No makeup", hint: "Home, the gym, an early beach, waking up" }

# Makeup by setting (default rule makeup-by-setting, character template
# v1.6). The sheet is bare-faced, so with no makeup line a character goes
# out bare-faced. Out in public: soft everyday makeup. These places and
# moments get no makeup. Words match whole words in the moment, the setting
# and the place; the owner's own choice or makeup words win, and so does
# soft glam the planner picked for a night out.
makeup_by_setting:
  bare:
    - at home
    - home
    - apartment
    - bedroom
    - in bed
    - bed
    - couch
    - sofa
    - living room
    - bathroom
    - kitchen
    - balcony
    - pajamas
    - pyjamas
    - waking up
    - wakes up
    - woke up
    - just woke
    - morning routine
    - gym
    - workout
    - working out
    - treadmill
    - weights
    - between sets
    - locker room
    - yoga
    - pilates
    - spin class
    - early beach
    - beach at dawn
    - beach at sunrise
    - sunrise on the beach

# Hair styling, rotated per scene (default rule hair-rotation, character
# template v1.6). The sheet holds one styling, so without a styling line
# every post copies it and the feed looks alike. Color and texture are the
# character's identity; only the placement rotates. A new scene starts with
# the next styling here not used in the last `hair_window` combo log entries
# or scenes. A styling the owner types (or names in the idea) wins.
hair_bank:
  - behind both shoulders
  - tucked behind one ear
  - blowing back off the face
  - half-up claw clip
  - low loose ponytail
  - high sleek ponytail
  - messy top bun
  - sunglasses as a headband
  - damp and air-dried
  - parted on the other side

# Aspect by destination (SPEC 5.2 rule 22).
destinations:
  - { id: vertical, label: "Reels, TikTok, Shorts, Stories", aspect: "9:16" }
  - { id: feed, label: "Feed post", aspect: "4:5" }
  - { id: square, label: "Square", aspect: "1:1" }
  - { id: portrait, label: "Portrait", aspect: "3:4" }
  - { id: landscape, label: "Landscape", aspect: "16:9" }

# When the setting or hair changes how hair and skin look, the colors are
# stated anyway (Callie's scene rules).
color_triggers: "\\b(wet|damp|soaked|swim\\w*|pool|ocean|sea|surf|beach|cove|shower|sweat\\w*|wind\\w*|slicked|harsh sun|midday sun|backlit|silhouette)\\b"

# One-change edits (SPEC 5.3). Ready-made changes for what QA finds.
edits:
  # The drift lock after a still from a trained character (DECISIONS D3):
  # a face-only pass with the still as the base plus REF-00 and the
  # closest-angle ref.
  drift_lock: "Make {poss} face and hair match the person in the other attached images exactly, the same person and not a lookalike"
  presets:
    - { id: look_at_lens, label: "Look into the lens", text: "Turn {poss} head slightly so {subj} looks straight into the lens with a soft, knowing half-smile, mouth closed", face: true }
    - { id: close_mouth, label: "Close her mouth", text: "Close {poss} mouth into a relaxed, natural expression", face: true }
    - { id: remove_logo, label: "Remove a logo or text", text: "Remove the {thing}, leaving that surface plain and unbranded" }
    - { id: remove_jewelry, label: "Remove extra jewelry", text: "Remove the {thing}" }
    # Diagnose and revise (the ultra-realism guide's table, owner
    # 2026-10-13): the rows a one-change still edit can fix.
    - { id: dx_plastic, group: diagnose, label: "Plastic face", hint: "Remove beauty language; restrained, distance-appropriate skin", text: "Restore real skin on {poss} face at this distance: visible pores and subtle color variation where the light reveals them, no beauty smoothing, no waxy sheen, the same person", face: true }
    - { id: dx_staged, group: diagnose, label: "Staged performance", hint: "An ordinary task, one trigger, a small reaction", text: "Change {poss} expression to an unguarded reaction to something just off camera, a brief glance and a small half-smile, instead of a pose for the lens", face: true }
    - { id: dx_hands, group: diagnose, label: "Hands or objects morph", hint: "Show contact; name the resting state", text: "Fix {poss} hand on the {thing}: five natural fingers in real contact with it, a steady grip, nothing floating" }
    - { id: dx_background, group: diagnose, label: "Background looks synchronized", hint: "A few people, different small activities", text: "Give the people in the background different small activities, none looking at the camera, no duplicated people" }
    - { id: dx_low_light, group: diagnose, label: "Low light looks synthetic", hint: "Name the practical source; keep its direction", text: "Light the scene only from the {thing} with one steady direction, and remove the unexplained rim light" }
    - { id: dx_overprocessed, group: diagnose, label: "Looks overprocessed", hint: "One recording look; no HDR, sharpening or beauty", text: "Remove the overprocessed look: no oversharpening halos, no HDR glow, ordinary phone color and saturation" }

# The ultra-realism guide's "Diagnose and revise" table (owner,
# 2026-10-13), under the video prompt: when a take looks off, the first
# useful revision to the prompt. Change one group at a time.
diagnose:
  - { symptom: "Plastic face", revision: "Check the reference; remove beauty language; ask for restrained, distance-appropriate skin." }
  - { symptom: "Staged performance", revision: "Add an ordinary task, one trigger, a small reaction, and a return to the task." }
  - { symptom: "Restless camera", revision: "Keep one operator and one reachable viewpoint; remove unmotivated moves and repeated focus hunting." }
  - { symptom: "Hands or objects morph", revision: "Simplify the interaction; show contact before movement and name the final resting state." }
  - { symptom: "Props reset after a cut", revision: "Carry the changed place, owner, fill level and direction into the next shot." }
  - { symptom: "Background looks synchronized", revision: "Give a few people different small activities; fewer people." }
  - { symptom: "Dialogue feels rushed", revision: "Shorten the line, leave silence, or simplify what happens at the same time." }
  - { symptom: "Low light looks synthetic", revision: "Name the practical light sources; keep the light direction steady; no unexplained rim light." }
  - { symptom: "Clip looks overprocessed", revision: "Remove VHS, grain, HDR, sharpening and beauty effects; choose one recording look." }

# Video from a picked still (Stage 9, owner ruling 2026-10-13). Every value
# is a default the owner can change on the video card.
video:
  # Owner, 2026-10-13: pick the model per take. Kling 3.0 Pro unless the
  # owner picked another (the last pick is remembered per account).
  model: higgsfield/kling-3.0-pro
  models:
    - { ref: higgsfield/kling-3.0-pro }
    - { ref: higgsfield/kling-3.0-standard }
    - { ref: higgsfield/seedance-2.0, resolution: 720p }
    - { ref: higgsfield/seedance-2.5, resolution: 720p }
    - { ref: higgsfield/wan-3.0, resolution: 720p }
  durations: [5, 10]
  duration: 5
  aspect: "9:16"
  max_takes: 4
  takes: 1
  # Directions added to every video prompt (editable per clip).
  directions: "No talking, no winking, steady eye contact. One continuous take, no cuts."
  # Optional, off by default: a cheap motion check for complex movement.
  test: { model: higgsfield/kling-3.0-turbo, duration: 5, resolution: 720p, label: "Quick motion test", note: "Faces not representative" }
  # "Upscale this take": the exact take, never re-rolled.
  upscale: { model: higgsfield/video-upscale }
  # The end frame helper inpaints only the head of the start frame.
  end_frame:
    model: higgsfield/nano-banana-2.1
    presets:
      - { id: look_at_lens, label: "Looks into the lens", text: "{subj} turns {poss} head toward the camera and looks straight into the lens with a soft, closed-mouth smile" }
      - { id: laugh, label: "Soft laugh", text: "{subj} laughs softly, eyes crinkling, mouth slightly open" }
      - { id: look_away, label: "Looks away", text: "{subj} glances away to the side, relaxed and calm" }

